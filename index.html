<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#3b6ef5">
<title>物理教师教学管理工作台</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* ============================================================
   物理教师教学管理工作台 —— 样式表
   护眼浅色主题（Notion/飞书风格），适配华为 MatePad 11.5s 触摸
   按钮/交互元素均 ≥ 44px
   ============================================================ */
:root {
  --bg: #f4f5f7; --card: #ffffff;
  --text: #1f2329; --text2: #6b7280; --text3: #9aa1ab;
  --border: #e6e8ec; --primary: #3b6ef5; --primary-soft: #eef3ff;
  --danger: #e5484d; --ok: #1f9d55;
  --shadow: 0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
  --radius: 14px;
  /* 指标层次 */
  --tier-A: #d03b3b; --tier-A-bg: #fdeaea; --tier-A-line: #f3c3c3;
  --tier-B: #c77a00; --tier-B-bg: #fff4de; --tier-B-line: #f5d9a4;
  --tier-C: #2f6fdb; --tier-C-bg: #e8f1fe; --tier-C-line: #c2d8f8;
  --tier-D: #7a828c; --tier-D-bg: #f1f2f4; --tier-D-line: #e0e3e8;
  --tier-N: #9aa1ab; --tier-N-bg: #f5f6f7; --tier-N-line: #e6e8ec;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; touch-action: manipulation; }
input, textarea, select { font-family: inherit; }
.hidden { display: none !important; }

/* ---------- 顶栏 ---------- */
header {
  position: sticky; top: 0; z-index: 50; background: var(--card);
  border-bottom: 1px solid var(--border); padding: 10px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
}
.brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .4px; }
.brand .sub { color: var(--text2); font-size: 12px; }
.brand .sub b { color: var(--ok); font-weight: 600; }
.header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hbtn {
  min-height: 44px; padding: 0 13px; border: 1px solid var(--border); border-radius: 10px;
  background: #fff; color: var(--text); font-size: 14px; display: inline-flex; align-items: center; gap: 5px;
}
.hbtn:active { background: #f1f2f4; }
.hbtn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.switch-wrap { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; }
.switch-wrap .sw-label { font-size: 13px; color: var(--text2); font-weight: 600; }
.switch { position: relative; width: 52px; height: 30px; border-radius: 20px; background: #cdd2da; border: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch.on { background: #22a06b; } .switch.on::after { left: 25px; }

/* 模式横幅 */
.mode-banner { display: none; padding: 9px 16px; font-size: 13px; margin: 12px 16px 0; border-radius: 10px; }
.mode-banner.rep { background: #fff7e6; border: 1px solid #f0d9a8; color: #8a5a00; }
.mode-banner.show { display: block; }

/* ---------- 班级标签页 ---------- */
.tabs { display: flex; gap: 9px; padding: 13px 16px 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tab {
  flex: 1 1 0; min-width: 0; min-height: 52px; border: 1px solid var(--border); border-radius: 12px;
  background: #fff; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 5px 6px; font-size: 15px; font-weight: 600;
}
.tab .badge { font-size: 11px; font-weight: 500; color: var(--text2); }
.tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.tab.active .badge { color: rgba(255,255,255,.85); }
.tab.special.active { background: #e5484d; border-color: #e5484d; }

/* ---------- 公告栏（主题位置） ---------- */
.bulletin { background: linear-gradient(135deg, #eef3ff 0%, #f7f9ff 100%); border: 1px solid #c7d7fb; border-radius: var(--radius); margin: 13px 16px 0; box-shadow: var(--shadow); }
.bulletin-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px 8px; }
.bulletin-head h2 { margin: 0; font-size: 16px; font-weight: 800; color: #24408f; }
.bulletin-head .tag { font-size: 11px; color: #5a6ea8; }
.bulletin-week { padding: 0 16px 6px; }
.bulletin-week textarea, .bulletin-week input { width: 100%; border: 1px solid #c7d7fb; border-radius: 9px; padding: 8px 12px; font-size: 14px; outline: none; background: #fff; resize: vertical; min-height: 40px; }
.bulletin-toggle { min-height: 36px; padding: 0 12px; border: 1px solid #c7d7fb; background: #fff; border-radius: 8px; font-size: 13px; color: #24408f; }
.week-switcher { display:inline-flex; align-items:center; gap:4px; background:#f0f4ff; border:1px solid #c7d7fb; border-radius:18px; padding:2px 6px; margin-left:4px }
.week-switcher #weekLabel { font-size:13px; font-weight:700; color:#24408f; padding:0 6px; min-width:120px; text-align:center }
.week-nav, .week-today { min-height:30px; min-width:30px; padding:0 8px; border:none; background:transparent; color:#24408f; font-size:14px; cursor:pointer; border-radius:14px }
.week-nav:hover, .week-today:hover { background:#dbe5ff }
.bulletin-classes { padding: 0 16px 12px; display:flex; flex-direction:column; gap:10px }
.bcls-row { background:#fff; border:1px solid var(--border); border-radius:10px; padding:10px 12px }
.bcls-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px }
.bcls-head .bcls-name { font-weight:700; font-size:14px; color:#24408f }
.bcls-head .bcls-cnt { font-size:11px; color:var(--text3) }
.bcls-days { display:grid; grid-template-columns: repeat(5, 1fr); gap:8px }
@media (max-width: 1100px) { .bcls-days { grid-template-columns: repeat(5, 1fr); gap:5px } }
@media (max-width: 760px) { .bcls-days { grid-template-columns: repeat(2, 1fr); gap:6px } }
.bcls-weekend-days { display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; margin-bottom:10px }
@media (max-width: 640px) { .bcls-weekend-days { grid-template-columns: 1fr; } }
.bcls-day { background:#fafbfc; border:1px solid var(--border); border-radius:8px; padding:8px; min-height:150px; display:flex; flex-direction:column; gap:6px }
.bcls-day.weekend { background:#fffaf3; border-color:#f0d9a8 }
.bcls-day .bd-label { font-size:13px; font-weight:700; color:#24408f }
.bcls-day.weekend .bd-label { color:#d9700c }
.bcls-lesson { position:relative; background:#fff; border:1px solid #dfe5ee; border-radius:7px; padding:6px 7px; font-size:12px; display:flex; flex-direction:column; gap:5px }
.bcls-lesson.review { border-left:3px solid #5b6bd6 }
.bcls-lesson.exam { border-left:3px solid #d9700c }
.bcls-lesson .bl-period { display:flex; align-items:center; gap:5px }
.bcls-lesson .bl-period-no { font-size:11px; font-weight:700; color:var(--text3); flex-shrink:0 }
.bcls-lesson .bl-time { flex:1; min-height:27px; border:1px solid var(--border); border-radius:5px; padding:2px 5px; font-size:11px; color:var(--text2); background:#fff }
.bcls-lesson .bl-time:disabled { background:#f7f8fa }
.bcls-lesson .bl-topic-wrap { display:flex; gap:4px; align-items:flex-start }
.bcls-lesson .bl-topic { flex:1; min-height:30px; resize:none; overflow:hidden; border:1px solid #dfe5ee; border-radius:5px; padding:3px 6px; font-size:12px; font-weight:600; color:#1a3a8e; line-height:1.4; word-break:break-word; background:#fff }
.bcls-lesson .bl-topic:disabled { background:#f7f8fa; color:#1a3a8e; border-color:transparent }
.bcls-lesson .bl-pick { flex-shrink:0; min-height:30px; min-width:32px; padding:0 7px; border:1px solid #c7d7fb; background:#eaf3ff; border-radius:5px; font-size:11px; color:#24408f; font-weight:700; cursor:pointer }
.bcls-lesson .bl-hw { display:flex; flex-direction:column; gap:3px; font-size:12px; color:#24408f; background:#f0f4ff; padding:3px 5px; border-radius:5px }
.bcls-lesson .bl-hw select { width:100%; border:1px solid #c7d7fb; background:#fff; font-size:11px; padding:2px; border-radius:4px }
.bcls-lesson .bl-hw select:disabled { background:#f0f0f0; color:var(--text3) }
.bcls-lesson .bl-hw-custom { width:100%; border:1px dashed #c7d7fb; background:#fff; font-size:11px; padding:3px 5px; border-radius:4px; min-height:27px; color:var(--text2) }
.bcls-lesson .bl-hw-custom:disabled { background:#f7f8fa }
.bcls-lesson .bl-del { position:absolute; top:-8px; right:-8px; width:22px; height:22px; border-radius:50%; border:1px solid #f3c3c3; background:#fff; color:#d03b3b; font-size:13px; line-height:1; cursor:pointer }
.bcls-day .bl-add { min-height:34px; border:1px dashed #c7d7fb; background:transparent; border-radius:6px; font-size:12px; color:#24408f; cursor:pointer }
.bcls-day .bl-add:hover { background:#eaf3ff }
.bcls-day.today { outline:2px solid #3b6ef5; outline-offset:-2px }
.topic-pick-list { display:flex; flex-wrap:wrap; gap:8px; max-height:50vh; overflow-y:auto }
.topic-pick { min-height:44px; padding:0 14px; border:1px solid #c7d7fb; background:#eaf3ff; border-radius:9px; font-size:13px; color:#24408f; cursor:pointer }
.topic-pick:hover { background:#dbe5ff }

.qg-stat { display:flex; align-items:center; gap:6px; padding:8px 0; flex-wrap:wrap; border-bottom:1px solid var(--border); margin-bottom:8px }
.qg-pill { display:inline-flex; align-items:center; min-height:30px; padding:0 10px; border-radius:15px; font-size:13px; font-weight:700 }
.qg-pill.A { background:#d3f0e0; color:#1f9d55 }
.qg-pill.B { background:#dbe5ff; color:#24408f }
.qg-pill.C { background:#fdebd6; color:#d9700c }
.qg-pill.D { background:#fde0e0; color:#d03b3b }
.qg-pill.none { background:#f0f0f0; color:#888 }
.qg-actions { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap }
.qg-list { max-height:55vh; overflow-y:auto; -webkit-overflow-scrolling:touch }
.qg-row { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; padding:8px; border-bottom:1px solid #f0f0f0 }
.qg-row.done { background:#f8fbff }
.qg-row .qg-name { flex:1; min-width:110px; font-size:14px; font-weight:600 }
.qg-row .qg-sub { margin-left:6px; font-size:11px; color:var(--text3); font-weight:400 }
.qg-btns { display:flex; gap:6px; flex-wrap:wrap }
.qg-btn { min-width:62px; min-height:52px; padding:0 10px; border:1px solid #dfe5ee; background:#fff; border-radius:9px; font-size:16px; font-weight:700; color:var(--text2) }
.qg-btn.A.active { background:#1f9d55; color:#fff; border-color:#1f9d55 }
.qg-btn.B.active { background:#3b6ef5; color:#fff; border-color:#3b6ef5 }
.qg-btn.C.active { background:#d9700c; color:#fff; border-color:#d9700c }
.qg-btn.D.active { background:#d03b3b; color:#fff; border-color:#d03b3b }
.qg-note { width:100%; min-height:38px; resize:none; overflow:hidden; border:1px dashed var(--border); border-radius:7px; padding:6px 9px; font-size:13px; color:var(--text); background:#fff }
.qg-legend { display:flex; flex-wrap:wrap; gap:10px; padding:8px 4px; font-size:11px; color:var(--text3); border-top:1px solid var(--border); margin-top:8px }
.rank-tag { display:inline-block; min-width:42px; padding:2px 4px; border-radius:4px; background:#24408f; color:#fff; font-size:10px; font-weight:700; text-align:center; margin-right:6px; vertical-align:middle }
.missing-list .rank-tag { background:#5b6bd6; color:#fff }
.bcls-lesson.review .bl-topic { color:#d9700c }
.bcls-lesson.exam .bl-topic { color:#d03b3b }
.bulletin-sync { min-height: 36px; padding: 0 12px; border: none; background: var(--primary); color: #fff; border-radius: 8px; font-size: 13px; font-weight: 600; }
.bulletin-sync:active { background: #2f5fdc; }
.bulletin-days { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; padding: 0 16px 12px; }
.bday { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 10px 11px; display: flex; flex-direction: column; }
.bday.weekend { background: #fffaf3; border-color: #f0d9a8; }
.bday .bd-label { font-size: 14px; font-weight: 700; color: #24408f; margin-bottom: 6px; }
.bday .bd-field { margin-bottom: 7px; }
.bday .bd-field .fl { font-size: 11px; color: var(--text3); margin-bottom: 2px; }
.bday input, .bday textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; font-size: 13px; outline: none; background: #fafbfc; color: var(--text); }
.bday input { min-height: 38px; }
.bday textarea { min-height: 58px; resize: none; overflow: hidden; line-height: 1.5; font-family: inherit; }
.bday input:focus, .bday textarea:focus { border-color: var(--primary); background: #fff; }
.bday textarea[disabled] { background: #fafbfc; color: var(--text); -webkit-text-fill-color: var(--text); opacity: 1; }
@media (max-width: 900px) { .bulletin-days { grid-template-columns: 1fr; } }
/* 节假日作业 */
.bulletin-holiday { padding: 0 16px 14px; }
.holiday-head { font-size: 13px; font-weight: 700; color: #24408f; margin: 4px 0 8px; }
.weekend-head { cursor: pointer; display: flex; align-items: center; justify-content: space-between; user-select: none; }
.weekend-arrow { font-size: 12px; color: var(--text2); font-weight: 600; }
.holiday-entry { display: grid; grid-template-columns: 1.2fr 2fr 1.2fr 1.4fr auto; gap: 7px; align-items: center; margin-bottom: 7px; }
.holiday-entry input { border: 1px solid #c7d7fb; border-radius: 8px; padding: 6px 9px; font-size: 13px; outline: none; min-height: 38px; background: #fff; }
.holiday-entry input:focus { border-color: var(--primary); }
.holiday-del { width: 38px; height: 38px; border: none; background: #fdeaea; color: var(--danger); border-radius: 8px; font-size: 16px; }
.add-holiday { min-height: 42px; padding: 0 16px; border: 1px dashed #c7d7fb; background: #f7f9ff; color: #24408f; border-radius: 9px; font-size: 14px; }
@media (max-width: 720px) { .holiday-entry { grid-template-columns: 1fr 1fr; } }
/* 本节课预设名单 */
.roster-item { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; border-bottom: 1px dashed var(--border); }
.roster-item .lq-body { flex: 1; min-width: 0; }
.roster-in { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 13px; outline: none; min-height: 36px; margin-top: 5px; background: #fff; }
.roster-in:focus { border-color: var(--primary); }
.roster-del { width: 36px; height: 36px; border: 1px solid var(--border); background: #fff; border-radius: 8px; font-size: 16px; color: var(--text2); flex-shrink: 0; }
.qi-add { min-height: 36px; min-width: 36px; border: none; background: var(--primary-soft); color: var(--primary); border-radius: 8px; font-size: 18px; font-weight: 700; }
.mini-btn { min-height: 44px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--border); background: #fff; font-size: 14px; color: var(--text); }
/* 手动选人 */
.picker-group { margin-bottom: 12px; }
.pg-label { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.pg-label.A { color: var(--tier-A); } .pg-label.B { color: var(--tier-B); } .pg-label.C { color: var(--tier-C); } .pg-label.D { color: var(--tier-D); } .pg-label.none { color: var(--tier-N); }
.pg-items { display: flex; flex-wrap: wrap; gap: 7px; }
.picker-item { min-height: 42px; padding: 0 13px; border: 1px solid var(--border); background: #fff; border-radius: 10px; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.picker-item.added { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 600; }
.picker-item .pi-count { font-size: 11px; color: var(--text3); }
.picker-item.added .pi-count { color: var(--primary); }

/* ---------- 指标总览 ---------- */
.overview { display: flex; gap: 9px; padding: 13px 16px 0; flex-wrap: wrap; }
.ov-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 11px 13px; min-width: 96px; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: var(--shadow);
}
.ov-card .num { font-size: 24px; font-weight: 800; line-height: 1.1; }
.ov-card .num small { font-size: 13px; font-weight: 600; color: var(--text3); }
.ov-card .lbl { font-size: 12px; color: var(--text2); margin-top: 2px; }
.ov-card.tier-A { border-left: 4px solid var(--tier-A); } .ov-card .num.tA { color: var(--tier-A); }
.ov-card.tier-B { border-left: 4px solid var(--tier-B); } .ov-card .num.tB { color: var(--tier-B); }
.ov-card.tier-C { border-left: 4px solid var(--tier-C); } .ov-card .num.tC { color: var(--tier-C); }
.ov-card.tier-D { border-left: 4px solid var(--tier-D); } .ov-card .num.tD { color: var(--tier-D); }

/* 作业收缴情况条 */
.hwbar { flex-basis: 100%; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; box-shadow: var(--shadow); }
.hwbar .hb-title { font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 7px; }
.hwbar .hb-chips { display: flex; gap: 7px; flex-wrap: wrap; }
.hw-chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 8px; padding: 4px 11px; font-size: 13px; font-weight: 600; border: 1px solid; }
.hw-chip b { font-size: 15px; }
.hw-chip.missing { color: var(--tier-A); background: #fff0f0; border-color: #f3c3c3; }
.hw-chip.submitted { color: var(--ok); background: #e8f6ee; border-color: #b9e2ca; }
.hw-chip.late { color: #6d5bd0; background: #f1eefd; border-color: #d2c9f5; }

.special-note { flex-basis: 100%; background: #fff1f1; border: 1px solid #f3c3c3; color: #a02020; border-radius: 10px; padding: 7px 13px; font-size: 12px; }

/* ---------- 主布局 ---------- */
.layout { display: grid; grid-template-columns: 1fr 360px; gap: 13px; padding: 13px 16px 46px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
.col-main { min-width: 0; }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 15px; border-bottom: 1px solid var(--border); }
.panel-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
.panel-head .ph-sub { font-size: 12px; color: var(--text3); }
.collapsible .panel-head { cursor: pointer; user-select: none; }
.collapsible .panel-head:hover { background: #f7f8fa; }
.ph-toggle { min-height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--border); background: #fff; font-size: 12px; color: var(--primary); font-weight: 600; cursor: pointer; flex-shrink: 0; }

/* 筛选栏 */
.filter-bar { display: flex; gap: 7px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.chip { min-height: 40px; padding: 0 13px; border-radius: 20px; border: 1px solid var(--border); background: #fff; font-size: 13px; color: var(--text2); }
.chip.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 600; }
.search-box { flex: 1; min-width: 130px; min-height: 44px; }
.search-box input { width: 100%; min-height: 44px; padding: 0 13px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; outline: none; }
.search-box input:focus { border-color: var(--primary); }
.sort-select { min-height: 44px; border: 1px solid var(--border); border-radius: 10px; padding: 0 10px; font-size: 14px; outline: none; background: #fff; color: var(--text); }
.batch-toggle { min-height: 44px; padding: 0 13px; border-radius: 10px; border: 1px dashed var(--border); background: #fff; font-size: 14px; color: var(--text2); }
.batch-toggle.on { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 600; }

/* 批量操作条 */
.batch-bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); background: #fbfcff; flex-wrap: wrap; }
.batch-bar .bb-info { font-size: 13px; color: var(--text2); flex: 1; }

/* 学生卡片 */
.student-list { padding: 11px 14px 14px; display: flex; flex-direction: column; gap: 9px; }
.student-card { border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; border-left: 5px solid var(--tier-D); position: relative; }
.student-card.tier-A { border-left-color: var(--tier-A); background: linear-gradient(90deg, var(--tier-A-bg) 0%, #fff 60px); }
.student-card.tier-B { border-left-color: var(--tier-B); background: linear-gradient(90deg, var(--tier-B-bg) 0%, #fff 60px); }
.student-card.tier-C { border-left-color: var(--tier-C); background: linear-gradient(90deg, var(--tier-C-bg) 0%, #fff 60px); }
.student-card.tier-D { border-left-color: var(--tier-D); }
.student-card.tier-N { border-left-color: var(--tier-N); }
.sc-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sc-rank { font-size: 12px; font-weight: 600; color: var(--text2); background: #f1f2f4; border-radius: 6px; padding: 2px 8px; }
.sc-name { font-size: 18px; font-weight: 700; }
.sc-tier { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 8px; }
.sc-tier.A { color: var(--tier-A); background: var(--tier-A-bg); }
.sc-tier.B { color: var(--tier-B); background: var(--tier-B-bg); }
.sc-tier.C { color: var(--tier-C); background: var(--tier-C-bg); }
.sc-tier.D { color: var(--tier-D); background: var(--tier-D-bg); }
.sc-tier.N { color: var(--tier-N); background: var(--tier-N-bg); }
.sc-stats { display: flex; gap: 7px; margin-top: 8px; }
.sc-stat { flex: 1; background: #f7f8fa; border: 1px solid var(--border); border-radius: 8px; padding: 5px 7px; text-align: center; }
.sc-stat span { display: block; font-size: 11px; color: var(--text3); }
.sc-stat b { font-size: 16px; font-weight: 700; }
.sc-question { margin-top: 7px; font-size: 12px; color: var(--text2); }
.sc-question .asked { color: var(--primary); font-weight: 600; }
.sc-actions { display: flex; gap: 7px; margin-top: 9px; align-items: center; flex-wrap: wrap; }
.act-btn { min-height: 42px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--border); background: #fff; font-size: 14px; color: var(--text); }
.act-btn:active { background: #f1f2f4; }
.act-btn.ask { color: var(--primary); border-color: #c7d7fb; }
.hw-btn { min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid; font-size: 14px; font-weight: 600; }
.hw-btn.missing { color: var(--tier-A); background: #fff0f0; border-color: #f3c3c3; }
.hw-btn.submitted { color: var(--ok); background: #e8f6ee; border-color: #b9e2ca; }
.hw-btn.late { color: #6d5bd0; background: #f1eefd; border-color: #d2c9f5; }
.sc-check { width: 32px; height: 32px; border-radius: 8px; border: 2px solid var(--border); background: #fff; font-size: 18px; color: #fff; }
.sc-check.checked { background: var(--primary); border-color: var(--primary); }

/* 课代表模式简表（两列/三列卡片网格） */
.rep-list { padding: 8px 14px 14px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 1100px) { .rep-list { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 640px) { .rep-list { grid-template-columns: 1fr; } }
.rep-row { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 11px; }
.rep-row .rr-rank { font-size: 12px; color: var(--text3); width: 40px; flex-shrink: 0; }
.rep-row .rr-name { flex: 1; font-weight: 600; font-size: 16px; }
.rep-row .rr-btns { display: flex; gap: 6px; }
.rep-card { display: flex; flex-direction: column; gap: 8px; padding: 10px 11px; border: 1px solid var(--border); border-radius: 11px; background: #fff; }
.rep-top { display: flex; align-items: center; gap: 7px; }
.rep-top .rr-rank { font-size: 12px; color: var(--text3); flex-shrink: 0; }
.rep-top .rr-name { flex: 1; font-weight: 600; font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rep-card .rr-btns { display: flex; gap: 6px; }
.rep-card .rr-btns button { min-width: 0; flex: 1; padding: 0 6px; }
.rr-btns button { min-height: 44px; min-width: 58px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--border); background: #fff; font-size: 14px; font-weight: 600; }
.rr-btns button.on-missing { background: #fff0f0; color: var(--tier-A); border-color: #f3c3c3; }
.rr-btns button.on-submitted { background: #e8f6ee; color: var(--ok); border-color: #b9e2ca; }
.rr-btns button.on-late { background: #f1eefd; color: #6d5bd0; border-color: #d2c9f5; }
.rr-grade { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid; flex-shrink: 0; }
.rr-grade.A { background: #e8f6ee; color: #1f9d55; border-color: #b9e2ca; }
.rr-grade.B { background: #eaf3ff; color: #2f6bd6; border-color: #c7d7fb; }
.rr-grade.C { background: #fdf0e6; color: #d9700c; border-color: #f5d0a4; }
.rr-grade.D { background: #fff0f0; color: #d03b3b; border-color: #f3c3c3; }
.rr-grade.none { background: #f5f5f5; color: #999; border-color: #e0e0e0; }

/* ---------- 侧边栏 ---------- */
.col-side { display: flex; flex-direction: column; gap: 13px; }
.side-panel .panel-body { padding: 13px 15px; }

/* 本节课提问 */
.lesson-q-item { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; border-bottom: 1px dashed var(--border); }
.lesson-q-item:last-child { border-bottom: none; }
.lesson-q-item .lq-tier { font-size: 12px; font-weight: 700; width: 36px; text-align: center; border-radius: 6px; padding: 2px 0; flex-shrink: 0; }
.lq-tier.A { color: var(--tier-A); background: var(--tier-A-bg); } .lq-tier.B { color: var(--tier-B); background: var(--tier-B-bg); }
.lq-tier.C { color: var(--tier-C); background: var(--tier-C-bg); } .lq-tier.D { color: var(--tier-D); background: var(--tier-D-bg); }
.lesson-q-item .lq-body { flex: 1; min-width: 0; }
.lesson-q-item .lq-name { font-weight: 700; font-size: 15px; }
.lesson-q-item .lq-q { font-size: 13px; color: var(--text2); word-break: break-all; }
.lesson-q-item .lq-actions { display: flex; gap: 4px; flex-shrink: 0; }
.lq-actions button { min-height: 36px; min-width: 36px; border: 1px solid var(--border); background: #fff; border-radius: 8px; font-size: 14px; color: var(--text2); }
.next-btn { width: 100%; min-height: 52px; margin-top: 11px; border-radius: 12px; border: none; background: var(--primary); color: #fff; font-size: 16px; font-weight: 700; }
.next-btn:active { background: #2f5fdc; }

/* 队列 */
.queue-legend { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.queue-legend span { font-size: 11px; padding: 2px 8px; border-radius: 6px; }
.queue-item { display: flex; align-items: center; gap: 8px; padding: 8px 3px; border-bottom: 1px dashed var(--border); }
.queue-item:last-child { border-bottom: none; }
.queue-item .qi-tier { font-size: 12px; font-weight: 700; width: 34px; text-align: center; border-radius: 6px; padding: 2px 0; }
.qi-tier.A { color: var(--tier-A); background: var(--tier-A-bg); } .qi-tier.B { color: var(--tier-B); background: var(--tier-B-bg); }
.qi-tier.C { color: var(--tier-C); background: var(--tier-C-bg); } .qi-tier.D { color: var(--tier-D); background: var(--tier-D-bg); }
.queue-item .qi-name { flex: 1; font-weight: 600; }
.queue-item .qi-count { font-size: 12px; color: var(--text3); }

/* 作业收缴名单 */
.missing-list { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 9px; }
.missing-tag { border-radius: 8px; padding: 4px 11px; font-size: 13px; font-weight: 600; border: 1px solid; }
.missing-tag.missing { background: #fff0f0; color: var(--tier-A); border-color: #f3c3c3; }
.missing-tag.late { background: #f1eefd; color: #6d5bd0; border-color: #d2c9f5; }

/* 作业收缴汇总栏（收缴状态 + ABCD 等级，可点开查看） */
.hw-summary { margin-bottom: 10px; }
.hw-sum-label { font-size: 11px; color: var(--text3); font-weight: 700; margin: 8px 0 5px; }
.hw-sum-label:first-child { margin-top: 0; }
.hw-sum-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.hw-sum-chip { display: inline-flex; align-items: center; gap: 5px; min-height: 34px; padding: 0 11px; border-radius: 17px; border: 1px solid var(--border); background: #fff; font-size: 13px; cursor: pointer; }
.hw-sum-chip b { font-weight: 700; }
.hw-sum-chip span { font-size: 12px; font-weight: 700; min-width: 18px; text-align: center; }
.hw-sum-chip.submitted { background: #e8f6ee; color: #1f9d55; border-color: #b9e2ca; }
.hw-sum-chip.missing { background: #fff0f0; color: #d03b3b; border-color: #f3c3c3; }
.hw-sum-chip.late { background: #f1eefd; color: #6d5bd0; border-color: #d2c9f5; }
.hw-sum-chip.A { background: #e8f6ee; color: #1f9d55; border-color: #b9e2ca; }
.hw-sum-chip.B { background: #eaf3ff; color: #2f6bd6; border-color: #c7d7fb; }
.hw-sum-chip.C { background: #fdf0e6; color: #d9700c; border-color: #f5d0a4; }
.hw-sum-chip.D { background: #fff0f0; color: #d03b3b; border-color: #f3c3c3; }
.hw-sum-chip.none { background: #f5f5f5; color: #999; border-color: #e0e0e0; }
.hw-sum-chip.active { outline: 2px solid #3b6ef5; outline-offset: 1px; }
.hw-stu-panel { border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; margin-bottom: 10px; max-height: 320px; overflow-y: auto; }
.hw-stu-panel-head { font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 6px; }
.hw-stu-row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px dashed var(--border); }
.hw-stu-row:last-child { border-bottom: none; }
.hw-stu-no { width: 24px; height: 24px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.hw-stu-name { flex: 1; font-weight: 600; font-size: 14px; }

.empty-tip { color: var(--text3); font-size: 13px; }
.feedback-btn { width: 100%; min-height: 50px; margin-top: 10px; border-radius: 12px; border: none; background: #22a06b; color: #fff; font-size: 15px; font-weight: 700; }
.feedback-btn:active { background: #1c8559; }

/* 历史作业汇总 */
.hw-hist-item { border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; margin-bottom: 7px; cursor: pointer; }
.hw-hist-item.active { border-color: var(--primary); background: var(--primary-soft); }
.hw-hist-item .hh-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hw-hist-item .hh-top b { font-size: 14px; }
.hw-hist-item .hh-date { font-size: 11px; color: var(--text3); }
.hw-hist-item .hh-stats { font-size: 12px; color: var(--text2); margin-top: 3px; }

/* 留言板 */
.msg-box { border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; margin-bottom: 8px; }
.msg-box .mb-head { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text3); margin-bottom: 3px; }
.msg-box .mb-text { font-size: 14px; word-break: break-all; }
.msg-box .mb-del { border: none; background: none; color: var(--danger); font-size: 13px; min-height: 30px; padding: 2px 6px; border-radius: 6px; }
.msg-add { display: flex; gap: 7px; margin-top: 8px; }
.msg-add input { flex: 1; min-height: 44px; border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; font-size: 14px; outline: none; }
.msg-add input:focus { border-color: var(--primary); }
.msg-add button { min-height: 44px; padding: 0 15px; border-radius: 10px; border: none; background: var(--primary); color: #fff; font-size: 14px; font-weight: 600; }

/* ---------- 弹窗 ---------- */
.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 640px) { .modal-mask { align-items: center; } }
.modal { background: #fff; width: 100%; max-width: 560px; max-height: 88vh; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 640px) { .modal { border-radius: 16px; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 15px 17px; border-bottom: 1px solid var(--border); }
.modal-head h2 { margin: 0; font-size: 17px; }
.modal-close { width: 44px; height: 44px; border: none; background: transparent; font-size: 26px; color: var(--text2); border-radius: 10px; }
.modal-close:active { background: #f1f2f4; }
.modal-body { padding: 15px 17px; overflow-y: auto; }

.q-summary { font-size: 13px; color: var(--text2); margin-bottom: 11px; }
.q-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.q-item { border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; }
.q-item .qi-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text3); margin-bottom: 3px; }
.q-item .qi-head .qi-type { font-weight: 600; }
.q-item .qi-type.class { color: var(--primary); } .q-item .qi-type.office { color: #6d5bd0; }
.q-item .qi-del { border: none; background: none; color: var(--danger); font-size: 13px; padding: 4px 8px; min-height: 32px; border-radius: 8px; }
.q-item .qi-q { font-weight: 600; font-size: 14px; }
.q-item .qi-a { font-size: 13px; color: var(--text2); margin-top: 2px; }
.q-add { display: flex; flex-direction: column; gap: 8px; }
.q-add input, .q-add textarea { min-height: 46px; padding: 0 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; outline: none; }
.q-add textarea { padding: 10px 12px; min-height: 84px; resize: vertical; }
.q-add input:focus, .q-add textarea:focus { border-color: var(--primary); }
.modal-actions { display: flex; gap: 9px; margin-top: 8px; flex-wrap: wrap; }
.btn { min-height: 46px; padding: 0 17px; border-radius: 10px; border: none; font-size: 15px; font-weight: 600; }
.btn.primary { background: var(--primary); color: #fff; } .btn.primary:active { background: #2f5fdc; }
.btn.ghost { background: #f1f2f4; color: var(--text); }
.btn.danger { background: #fdeaea; color: var(--danger); }
.btn.block { width: 100%; }

/* 作业标记六态 */
.hw-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.hw-opt { min-height: 60px; border-radius: 12px; border: 1px solid var(--border); font-size: 15px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.hw-opt .ho-sub { font-size: 11px; font-weight: 400; color: var(--text3); }

/* 设置/数据管理 */
.set-row { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
.set-row label { flex: 1; font-size: 14px; }
.set-row .triple { display: flex; gap: 6px; }
.set-row input[type=number] { width: 90px; min-height: 44px; border: 1px solid var(--border); border-radius: 8px; text-align: center; font-size: 15px; outline: none; padding: 0 8px; }
.set-row input[type=text] { flex: 1; min-height: 44px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; outline: none; padding: 0 12px; }
.set-row input:focus { border-color: var(--primary); }
.dm-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: 1px dashed var(--border); }
.dm-item:last-child { border-bottom: none; }
.dm-item .dm-txt { font-size: 14px; } .dm-item .dm-txt small { display: block; color: var(--text3); font-size: 12px; }

.feedback-text { white-space: pre-wrap; background: #f7f8fa; border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 14px; min-height: 110px; }

/* toast + 回顶部 */
.toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(80px); background: #1f2329; color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 14px; opacity: 0; transition: all .25s; z-index: 200; max-width: 86vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.totop { position: fixed; right: 16px; bottom: 22px; width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--border); background: #fff; box-shadow: var(--shadow); font-size: 20px; color: var(--text2); z-index: 40; }
.totop:active { background: #f1f2f4; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>物理教师教学管理工作台</h1>
    <div class="sub">数据本地永久保存 · 上次保存 <b id="lastSave">—</b></div>
  </div>
  <div class="header-actions">
    <button class="hbtn" id="btnManage" onclick="openDataManage()">数据管理</button>
    <button class="hbtn" id="btnExport" onclick="exportData()">导出备份</button>
    <button class="hbtn" id="btnImport" onclick="document.getElementById('fileInput').click()">导入</button>
    <button class="hbtn" id="btnSettings" onclick="openSettings()">设置</button>
    <div class="switch-wrap">
      <span class="sw-label">课代表模式</span>
      <button class="switch" id="repSwitch" onclick="toggleRepresentative()" aria-label="切换课代表模式"></button>
    </div>
  </div>
  <input type="file" id="fileInput" accept="application/json,.json" class="hidden" onchange="importData(event)">
</header>

<div class="mode-banner rep" id="repBanner">课代表模式 · 只负责收交作业，可查看教学公告栏与作业名单，不显示成绩与指标。</div>

<!-- 班级标签页 -->
<nav class="tabs" id="tabs"></nav>

<!-- 教学公告栏（按周设计，按班级分开：每节课标题预填+作业选择器） -->
<section class="bulletin" id="bulletin">
  <div class="bulletin-head">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <h2 id="bulletinTitle">教学公告栏</h2>
      <span class="tag" id="bulletinHint"></span>
      <span class="tag" id="todayLabel" style="background:#eaf3ff;color:#24408f;border-color:#c7d7fb;font-weight:700"></span>
      <div class="week-switcher">
        <button class="week-nav" onclick="switchWeek(-1)" title="上一周">◀</button>
        <span id="weekLabel">第1周 9.1-9.4</span>
        <button class="week-nav" onclick="switchWeek(1)" title="下一周">▶</button>
        <button class="week-today" onclick="jumpToCurrentWeek()">本周</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
      <button class="bulletin-sync" id="btnSyncBulletin" onclick="syncBulletin()">同步到其他班</button>
      <button class="bulletin-toggle" id="btnExportBulletin" onclick="exportBulletin()">导出打印</button>
      <button class="bulletin-toggle" id="bulletinToggle" onclick="toggleBulletin()">收起</button>
    </div>
  </div>
  <div class="bulletin-body" id="bulletinBody">
    <div class="bulletin-week">
      <textarea id="weekTask" placeholder="本周教学进度（自动从教研安排填充，可改写）" onchange="saveWeekTask(this.value)"></textarea>
    </div>
    <div class="bulletin-classes" id="bulletinClasses"></div>
    <div class="bulletin-holiday" id="bulletinHoliday"></div>
  </div>
</section>

<!-- 指标总览 + 作业收缴情况 -->
<section class="overview" id="overview"></section>

<main class="layout">
  <section class="col-main">
    <div class="panel collapsible">
      <div class="panel-head" onclick="togglePanel('studentPanel')"><h2 id="listTitle">学生列表</h2><span class="ph-sub" id="listSortHint"></span><button class="ph-toggle" id="studentPanelToggle">展开</button></div>
      <div id="studentPanelBody" class="hidden">
        <div class="filter-bar" id="filterBar"></div>
        <div class="batch-bar hidden" id="batchBar"></div>
        <div class="student-list" id="studentList"></div>
      </div>
    </div>
  </section>

  <aside class="col-side">
    <!-- 作业收缴 -->
    <div class="panel side-panel" id="hwListPanel">
      <div class="panel-head"><h2>作业收缴</h2></div>
      <div class="panel-body">
        <div id="hwAssignBar"></div>
        <div id="hwListBox"></div>
        <button class="feedback-btn" id="feedbackBtn" onclick="generateFeedback()">生成今日反馈</button>
        <div id="hwHistory"></div>
      </div>
    </div>

    <!-- 本节课提问（课前预设 → 课后确认记录） -->
    <div class="panel side-panel collapsible" id="lessonPanel">
      <div class="panel-head" onclick="togglePanel('lessonPanel')"><h2>本节课提问 <span class="ph-sub" id="lessonCount"></span></h2><button class="ph-toggle" id="lessonPanelToggle">展开</button></div>
      <div class="panel-body hidden" id="lessonPanelBody">
        <input type="text" id="lessonTitle" placeholder="本节课标题（如：《内能》第3课时提问）" oninput="saveLessonTitle(this.value)" style="width:100%;min-height:42px;border:1px solid var(--border);border-radius:9px;padding:0 11px;font-size:14px;margin-bottom:8px;outline:none">

function deepMerge(base, extra) {
  const out = {};
  for (const k of new Set([...Object.keys(base), ...Object.keys(extra || {})])) {
    const b = base[k], e = (extra || {})[k];
    if (b && e && typeof b === "object" && typeof e === "object" && !Array.isArray(b) && !Array.isArray(e)) out[k] = deepMerge(b, e);
    else out[k] = (e !== undefined) ? e : b;
  }
  return out;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return deepMerge(defaultState(), JSON.parse(raw));
  } catch (e) { console.warn("读取本地数据失败", e); }
  return defaultState();
}

function saveState() {
  const json = JSON.stringify(state);
  try { localStorage.setItem(STORAGE_KEY, json); } catch (e) { console.warn("localStorage 写入失败", e); }
  idbSet(STORAGE_KEY, state);                       // 异步镜像到 IndexedDB（更持久）
  document.getElementById("lastSave").textContent = dateStr(Date.now());
}

/* ---- IndexedDB 镜像（异步，增强持久性，防止 localStorage 被清） ---- */
function idbOpen() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error("no idb"));
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE); };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function idbSet(key, val) {
  idbOpen().then(db => {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(val, key);
    tx.oncomplete = () => db.close();
  }).catch(() => {});
}
function idbGet(key) {
  return idbOpen().then(db => new Promise((res) => {
    const tx = db.transaction(DB_STORE, "readonly");
    const rq = tx.objectStore(DB_STORE).get(key);
    rq.onsuccess = () => { res(rq.result || null); db.close(); };
    rq.onerror = () => { res(null); db.close(); };
  })).catch(() => null);
}

/* 提问计数：课堂/课下、今日/本周/累计 */
function qCounts(questions) {
  const t0 = todayStart(), w0 = weekStart();
  let classN = 0, officeN = 0, todayN = 0, weekN = 0;
  for (const q of questions) {
    if (q.type === "class") classN++; else officeN++;
    const t = q.ts || 0; if (t >= t0) todayN++; if (t >= w0) weekN++;
  }
  return { classN, officeN, today: todayN, week: weekN, total: questions.length };
}

/* 当前周次（按日期算出） */
const TEACH_START = new Date(2026, 7, 31);  // 教研第1周的周一 Aug 31, 2026（9.1为周二开学，需对齐到该周周一，否则分周错位一周）

let weekLocked = false;   // 用户是否手动切换过周次（false=实时跟随当前日期，true=保持手动选择）
function computeCurrentWeekIdx() {
  const n = new Date();
  const dow = n.getDay();
  const mon = new Date(n);
  mon.setDate(n.getDate() - (dow === 0 ? 6 : dow - 1));
  const diffDays = Math.floor((mon - TEACH_START) / (86400000));
  return Math.max(0, Math.min(TEACH_PLAN.length - 1, Math.floor(diffDays / 7)));
}
function getLessonTopic(weekIdx, dayCode, period, clsCode, clsKey) {
  const board = getBoard(clsKey || currentClassKey);
  const key = `${dayCode}-${period}`;
  const week = (board.lessons || {})[weekIdx] || {};
  const ov = week[key];
  if (ov && ov.customTopic) return ov.customTopic;
  const plan = TEACH_PLAN[weekIdx];
  if (!plan) return "";
  // 收集该班在这一周的所有 (day, period)
  const clsLessons = [];
  for (let d = 1; d <= 5; d++) {
    const ds = SCHEDULE[String(d)] || {};
    for (let p = 1; p <= 8; p++) {
      if (ds[String(p)] === clsCode) clsLessons.push({ day: d, period: p });
    }
  }
  const idx = clsLessons.findIndex(x => x.day === dayCode && x.period === period);
  if (idx < 0) return "";
  const lessonList = plan.lessons;
  if (idx >= lessonList.length) return "";
  return lessonList[idx].topic;
}
function setLessonOverride(weekIdx, dayCode, period, key, val) {

  document.getElementById("weekLabel").textContent = `${plan.week} ${plan.dates}`;
  document.getElementById("bulletinHint").textContent = readOnly ? "（只读）" : "按周切换 · 每节课标题自动从教研安排填充 · 作业点击选择全品作业本";
  // 周任务文本（按周）
  if (!board.weekTasks[currentWeekIdx] || !board.weekTasks[currentWeekIdx].trim()) {
    board.weekTasks[currentWeekIdx] = plan.lessons.map(l => l.topic).join(" / ");
  }
  const wt = board.weekTasks[currentWeekIdx];
  document.getElementById("weekTask").value = wt || "";
  document.getElementById("weekTask").disabled = readOnly;
  // 周一~周五 5 天视图；周六周日并入下方「周末/节假日」板块（避免 7 列超出页面）
  const dayNames = ["", "周一", "周二", "周三", "周四", "周五", "周六", "周日"];
  const today = new Date();
  const todayCode = today.getDay() === 0 ? 7 : today.getDay();  // 1-7
  const isCurrentWeek = currentWeekIdx === computeCurrentWeekIdx();
  const m = CLASS_META.find(x => x.key === currentClassKey);
  const clsCode = m.clsCode;
  const weekLessons = board.lessons[currentWeekIdx] || {};

  // 某天该班节次列表（含自定义课时 period>=9）
  const dayPeriods = (d) => {
    const ds = SCHEDULE[String(d)] || {};
    const list = [];
    for (let p = 1; p <= 8; p++) if (ds[String(p)] === clsCode) list.push(p);
    for (const k in weekLessons) {
      const parts = k.split("-");
      if (parts.length === 2 && Number(parts[0]) === d && Number(parts[1]) >= 9) list.push(Number(parts[1]));
    }
    list.sort((a, b) => a - b);
    return list;
  };
  // 渲染单个「天」格子（周一~周日通用）
  const renderDay = (day) => {
    const dn = dayNames[day];
    const weekend = (day === 6 || day === 7);
    const isToday = isCurrentWeek && day === todayCode;
    const periods = dayPeriods(day);
    return `<div class="bcls-day ${weekend ? "weekend" : ""} ${isToday ? "today" : ""}">
      <div class="bd-label">${dn}${isToday ? "（今天）" : ""}</div>
      ${periods.map(p => renderLessonCell(currentWeekIdx, day, p, clsCode, readOnly)).join("")}
      ${readOnly ? "" : `<button class="bl-add" onclick="addCustomLesson(${day})">＋ 添加课时</button>`}
    </div>`;
  };

  let totalLessons = 0;
  for (let d = 1; d <= 7; d++) totalLessons += dayPeriods(d).length;

  document.getElementById("bulletinClasses").innerHTML = `<div class="bcls-row">
    <div class="bcls-head">
      <div class="bcls-name">${m.short} ${m.badge ? `<span class="tag" style="margin-left:6px">${m.badge}</span>` : ""}</div>
      <div class="bcls-cnt">本周共 ${totalLessons} 课时${totalLessons < plan.lessons.length ? "（本班进度少 1 节，自动顺延）" : ""}</div>
    </div>
    <div class="bcls-days">${[1, 2, 3, 4, 5].map(renderDay).join("")}</div>
  </div>`;
  renderWeekendHoliday(board, readOnly, renderDay);
  document.getElementById("bulletinBody").classList.toggle("hidden", !bulletinOpen);
  document.getElementById("bulletinToggle").textContent = bulletinOpen ? "收起" : "展开";
  document.getElementById("btnSyncBulletin").classList.toggle("hidden", isRepresentative);
  // 保存上次查看周次
  board.lastWeekIdx = currentWeekIdx;
  // 自适应高度
  document.querySelectorAll("#bulletinClasses textarea, #weekTask").forEach(autoResizeEl);
}

function renderLessonCell(weekIdx, dayCode, period, clsCode, readOnly) {
  const board = getBoard(currentClassKey);
  const ovKey = `${dayCode}-${period}`;
  const ov = (board.lessons[weekIdx] || {})[ovKey] || {};
  const isCustom = period >= 9;
  const topic = getLessonTopic(weekIdx, dayCode, period, clsCode);
  const topicVal = ov.customTopic != null ? ov.customTopic : topic;
  const timeVal = ov.customTime != null ? ov.customTime : (isCustom ? "" : (PERIOD_TIME[String(period)] || ""));
  const hwVal = ov.customHw || "";
  const hwOptionsHtml = buildHwSelectOptions(ov.hwKey);
  const isReview = /习题|复习/.test(topicVal);
  const isExam = /考试|月考|期中|期末/.test(topicVal);
  return `<div class="bcls-lesson ${isReview ? "review" : ""} ${isExam ? "exam" : ""}">
    <div class="bl-period">
      <span class="bl-period-no">${isCustom ? "自定义" : `第${period}节`}</span>
      <input type="text" class="bl-time" data-w="${weekIdx}" data-d="${dayCode}" data-p="${period}" data-f="customTime" value="${escapeHtml(timeVal)}" placeholder="时间" ${readOnly ? "disabled" : ""}>
    </div>
    <div class="bl-topic-wrap">
      <textarea class="bl-topic" rows="1" data-w="${weekIdx}" data-d="${dayCode}" data-p="${period}" data-f="customTopic" placeholder="教学内容" ${readOnly ? "disabled" : ""}>${escapeHtml(topicVal)}</textarea>
      ${readOnly ? "" : `<button class="bl-pick" onclick="openTopicPicker(${weekIdx},${dayCode},${period})" title="从教研安排选择">选</button>`}
    </div>
    <div class="bl-hw">
      <select data-w="${weekIdx}" data-d="${dayCode}" data-p="${period}" onchange="onLessonHwSelect(this)" ${readOnly ? "disabled" : ""}>
        <option value="">— 选作业 —</option>${hwOptionsHtml}
      </select>
      <input type="text" class="bl-hw-custom" data-w="${weekIdx}" data-d="${dayCode}" data-p="${period}" data-f="customHw" value="${escapeHtml(hwVal)}" placeholder="或手动填作业" ${readOnly ? "disabled" : ""}>
    </div>
    ${isCustom && !readOnly ? `<button class="bl-del" onclick="delCustomLesson(${dayCode},${period})" title="删除此课时">×</button>` : ""}
  </div>`;
}

/* 无课日期添加自定义课时（周四/周六/周日等） */
function addCustomLesson(day) {
  const board = getBoard(currentClassKey);
  if (!board.lessons[currentWeekIdx]) board.lessons[currentWeekIdx] = {};
  const wk = board.lessons[currentWeekIdx];
  let maxP = 8;
  for (const k in wk) {
    const parts = k.split("-");
    if (parts.length === 2 && Number(parts[0]) === day && Number(parts[1]) >= 9) maxP = Math.max(maxP, Number(parts[1]));
  }
  const p = maxP + 1;
  wk[`${day}-${p}`] = { customTopic: "", customTime: "", customHw: "" };
  saveState(); renderBulletin();
}
function delCustomLesson(day, period) {
  const board = getBoard(currentClassKey);
  const wk = board.lessons[currentWeekIdx];
  if (wk) delete wk[`${day}-${period}`];
  saveState(); renderBulletin();
}

/* 教学内容：点击选择（教研安排预设 + 常用课题） */
function openTopicPicker(weekIdx, dayCode, period) {
  const plan = TEACH_PLAN[weekIdx];
  const presets = [
    ...(plan ? plan.lessons.map(l => l.topic) : []),
    "习题课", "复习课", "月考讲评", "期中讲评", "期末讲评", "自习", "放假", "补课",
  ];
  const uniq = [...new Set(presets)];
  openModal(`
    <div class="modal-head"><h2>选择教学内容</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="empty-tip" style="margin-bottom:8px">点击填入下方文本框，也可直接手动编辑。</div>
      <div class="topic-pick-list">
        ${uniq.map(t => `<button class="topic-pick" onclick="pickTopic(${weekIdx},${dayCode},${period},'${escapeHtml(t).replace(/'/g, "\\'")}')">${escapeHtml(t)}</button>`).join("")}
      </div>
    </div>`);
}
function pickTopic(weekIdx, dayCode, period, topic) {
  setLessonOverride(weekIdx, dayCode, period, "customTopic", topic);
  closeModal();
  renderBulletin();
  toast("已设置教学内容");
}

/* 公告栏选了作业 → 自动创建一份作业（如果不存在） */
function onLessonHwSelect(sel) {
  const week = parseInt(sel.dataset.w, 10);
  const day = parseInt(sel.dataset.d, 10);
  const period = parseInt(sel.dataset.p, 10);
  const hwKey = sel.value || null;
  setLessonOverride(week, day, period, "hwKey", hwKey);
  if (hwKey) ensureAssignmentFromHwKey(hwKey, week, day);
}
function ensureAssignmentFromHwKey(hwKey, week, day) {
  const meta = parseHwKey(hwKey);
  if (!meta) return;
  const list = getAssignments(currentClassKey);
  let a = list.find(x => x.hwKey === hwKey);
  if (!a) {
    a = {
      id: Date.now() + Math.floor(Math.random() * 1000),
      title: meta.title,
      hwKey,
      date: `${TEACH_PLAN[week] ? TEACH_PLAN[week].dates : ""}`,
      due: "次日早读前",
      weekIdx: week,
      dayCode: day,
      createdAt: Date.now(),
    };
    list.push(a);
    state.currentAssignment[currentClassKey] = String(a.id);
    saveState();
    renderHwList(); renderOverview();
    toast(`已创建作业：${meta.title}`);
  } else {
    toast(`作业「${meta.title}」已存在`);
  }
}
function parseHwKey(hwKey) {
  // "qb:第十七章:4:1" → { ch, secNo, lessonNo, title }
  if (!hwKey.startsWith("qb:")) return null;
  const parts = hwKey.split(":");
  if (parts.length < 4) return null;
  const chKey = parts[1], secNo = parts[2], lessonNo = parseInt(parts[3], 10);
  const ch = QB_CATALOG[chKey];
  if (!ch) return null;
  const sec = ch.sections.find(s => s.secNo === secNo);
  if (!sec) return null;
  const les = sec.lessons.find(l => l.lessonNo === lessonNo);
  if (!les) return null;
  return {
    ch: chKey,
    secNo,
    lessonNo,
    title: `${ch.title.replace(/^第.+?\s+/, "")}·${sec.secName}${les.lessonNo > 1 ? `·第${les.lessonNo}课时` : ""}`,
    fullTitle: `${ch.title}·${sec.secName}${les.lessonNo > 1 ? `·第${les.lessonNo}课时` : ""}`,
  };
}

function buildHwSelectOptions(selected) {
  // 全品作业本目录 → 章 → 节 → 课时 三层
  const opts = [];
  Object.entries(QB_CATALOG).forEach(([chKey, ch]) => {
    opts.push(`<optgroup label="${escapeHtml(ch.title)}">`);
    ch.sections.forEach(sec => {
      sec.lessons.forEach(les => {
        const id = `qb:${chKey}:${sec.secNo}:${les.lessonNo}`;
        const label = `${sec.secName}${les.lessonNo > 1 ? `·第${les.lessonNo}课时` : ""}`;
        opts.push(`<option value="${id}" ${id === selected ? "selected" : ""}>${escapeHtml(label)}</option>`);
      });
    });
    opts.push(`</optgroup>`);
  });
  return opts.join("");
}

/* 周次切换 */
function switchWeek(delta) {
  weekLocked = true;
  currentWeekIdx = Math.max(0, Math.min(TEACH_PLAN.length - 1, currentWeekIdx + delta));
  renderBulletin();
}
function jumpToCurrentWeek() {
  weekLocked = false;
  currentWeekIdx = computeCurrentWeekIdx();
  renderBulletin();
}

/* 一键同步：把当前班的教学公告栏（教学进度+每日/节假日作业）复制到其他三个班 */
function syncBulletin() {
  const src = getBoard(currentClassKey);
  const others = CLASS_META.filter(m => m.key !== currentClassKey);
  if (!confirm(`确定把「${clsShort(currentClassKey)}」的教学公告栏（本周教学进度 + 周一~周日教学内容/作业 + 节假日作业）同步到 ${others.map(m => m.short).join("、")} 吗？将覆盖这些班的现有公告栏内容。`)) return;
  others.forEach(m => { state.boards[m.key] = JSON.parse(JSON.stringify(src)); });
  saveState(); renderBulletin();
  toast(`已同步到 ${others.map(m => m.short).join("、")}`);
}

/* 生成公告栏的 Excel（HTML 表格）内容 */
function buildBulletinHtml() {
  const cls = clsShort(currentClassKey);
  const plan = TEACH_PLAN[currentWeekIdx] || { week: "", dates: "" };
  const wt = (getBoard(currentClassKey).weekTasks && getBoard(currentClassKey).weekTasks[currentWeekIdx]) || "";
  // 4 班 × 7 天 × 课时 → 表格：横轴=周1-7，纵轴=各班该日课表
  const dayNames = ["", "周一", "周二", "周三", "周四", "周五", "周六", "周日"];
  let header = `<tr><th>班级</th>${[1,2,3,4,5,6,7].map(d => `<th>${dayNames[d]}</th>`).join("")}</tr>`;
  let bodyRows = "";
  CLASS_META.forEach(m => {
    const b = getBoard(m.key);
    const weekLessons = (b.lessons || {})[currentWeekIdx] || {};
    let cells = `<td style="font-weight:bold">${m.short}</td>`;
    for (let d = 1; d <= 7; d++) {
      const ds = SCHEDULE[String(d)] || {};
      const periods = [];
      for (let p = 1; p <= 8; p++) {
        if (ds[String(p)] === m.clsCode) periods.push(p);
      }
      // 自定义课时（周四/周六/周日添加的）
      for (const k in weekLessons) {
        const parts = k.split("-");
        if (parts.length === 2 && Number(parts[0]) === d && Number(parts[1]) >= 9) periods.push(Number(parts[1]));
      }
      periods.sort((a, b2) => a - b2);
      cells += `<td>${periods.length ? periods.map(p => {
        const ov = weekLessons[`${d}-${p}`] || {};
        const topic = ov.customTopic != null ? ov.customTopic : getLessonTopic(currentWeekIdx, d, p, m.clsCode, m.key);
        const time = ov.customTime || PERIOD_TIME[String(p)] || "";
        const hw = ov.customHw || (ov.hwKey ? (parseHwKey(ov.hwKey) || {}).title || "" : "");
        return `${p >= 9 ? "自定义" : `第${p}节`}${time ? " " + escapeHtml(time) : ""} ${escapeHtml(topic)}${hw ? `<br><small>作业：${escapeHtml(hw)}</small>` : ""}`;
      }).join("<br>") : "—"}</td>`;
    }
    bodyRows += `<tr>${cells}</tr>`;
  });
  let holidayRows = "";
  (getBoard(currentClassKey).holidays || []).forEach(h => {
    holidayRows += `<tr><td style="font-weight:bold">${escapeHtml(h.name)}</td><td colspan="3">${escapeHtml(h.hw)}</td><td>${escapeHtml(h.date)}</td><td>${escapeHtml(h.due)}</td></tr>`;
  });
  return `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body>
    <table border="1">
      <tr><td colspan="8" style="font-weight:bold;text-align:center;font-size:16px">${cls} 教学公告栏 · ${plan.week}（${plan.dates}）</td></tr>
      <tr><td colspan="8" style="font-weight:bold">本周教学任务：${escapeHtml(wt)}</td></tr>
      ${header}
      ${bodyRows}
      ${holidayRows ? `<tr><th colspan="8">节假日 / 特殊作业</th></tr><tr><th>名称</th><th colspan="3">作业</th><th colspan="2">日期</th><th colspan="2">上交时间</th></tr>${holidayRows}` : ""}
    </table>
  </body></html>`;
}

/* 导出打印：把当前班公告栏导出为 .xls（Excel/WPS 可打开打印） */
function exportBulletin() {
  const html = buildBulletinHtml();
  const blob = new Blob(["\ufeff" + html], { type: "application/vnd.ms-excel;charset=utf-8" });
  const a = document.createElement("a");
  const d = new Date(); const p = n => String(n).padStart(2, "0");
  a.href = URL.createObjectURL(blob);
  a.download = `${clsShort(currentClassKey)}教学公告栏_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.xls`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  toast("已导出 Excel，可用 WPS / Excel 打开打印");
}

function handleGradeFile(f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    const data = new Uint8Array(ev.target.result);
    try {
      const wb = XLSX.read(data, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const txt = XLSX.utils.sheet_to_csv(ws, { FS: "\t" });
      document.getElementById("giText").value = txt;
      toast("已读取 " + f.name + "（" + wb.SheetNames[0] + "），请点「解析并导入」");
    } catch (e) {
      toast("文件读取失败：" + e.message);
    }
  };
  r.readAsArrayBuffer(f);
}
/* 解析粘贴的 Excel 文本，返回 [{name, physics, physicsRank, physicsSchoolRank, totalScore, schoolRank, classRank}] */
function parseGradeText(txt) {
  const lines = txt.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  const first = lines[0].split(/\t|,/).map(s => s.trim());
  // 检测表头
  const headers = first;
  const findIdx = (...keys) => {
    for (const k of keys) {
      const i = headers.findIndex(h => h === k || h.includes(k));
      if (i >= 0) return i;
    }
    return -1;
  };
  const idxName = findIdx("姓名", "名字", "学生");
  const idxPhy = findIdx("物理", "物理成绩");
  const idxPhyCls = findIdx("物理班次", "物理班名次");
  const idxPhySch = findIdx("物理校次", "物理校名次");
  const idxTotal = findIdx("综合总分", "总分", "总成绩");
  const idxSchool = findIdx("综合校次", "校次", "总校次");
  const idxClass = findIdx("综合班次", "班级名次", "班次", "总班次");
  if (idxName < 0) return [];
  const out = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(/\t|,/).map(s => s.trim());
    if (cols.length < 2) continue;
    const num = v => {
      if (v == null) return null;
      const m = String(v).match(/-?\d+/);
      return m ? Number(m[0]) : null;
    };
    out.push({
      name: cols[idxName],
      physics: num(cols[idxPhy]),
      physicsClassRank: num(cols[idxPhyCls]),
      physicsSchoolRank: num(cols[idxPhySch]),
      totalScore: num(cols[idxTotal]),
      schoolRank: num(cols[idxSchool]),
      classRank: num(cols[idxClass]),
    });
  }
  return out;
}
function applyGradeImport() {
  const txt = document.getElementById("giText").value;
  const list = parseGradeText(txt);
  if (!list.length) { toast("未识别到有效数据，请确认表头含「姓名」字段"); return; }
  const stu = getClassStudents(currentClassKey);
  let updated = 0, missing = 0;
  list.forEach(rec => {
    if (!rec.name) return;
    const s = stu.find(x => x.name === rec.name);
    if (s) {
      ["physics", "physicsClassRank", "physicsSchoolRank", "totalScore", "schoolRank", "classRank"].forEach(k => {
        if (rec[k] != null) s[k] = rec[k];
      });
      updated++;
    } else {
      missing++;
    }
  });
  // 若 classRank 没提供，按 totalScore 重排
  reRankClass();
  saveState();
  document.getElementById("giPreview").innerHTML = `<div style="background:#e8f6ee;color:#1f9d55;padding:8px;border-radius:6px;margin-top:6px">已更新 ${updated} 人，未匹配 ${missing} 人（班级名次已自动重排）。${missing ? "未匹配学生名：" + list.filter(r => !stu.find(x => x.name === r.name)).map(x => x.name).slice(0,5).join("、") + (missing>5?" 等":"") : ""}</div>`;
  renderAll();
}

function saveStudent() {
  const name = document.getElementById("sfName").value.trim();
  if (!name) { toast("请填写姓名"); return; }
  const num = id => { const v = document.getElementById(id).value.trim(); return v === "" ? null : Number(v); };
  const list = getClassStudents(currentClassKey);
  if (editingStudent) {
    const s = list.find(x => x.name === editingStudent);
    if (!s) { toast("未找到该学生"); return; }
    const oldName = s.name;
    // 若改名，需同步迁移运行时数据
    if (name !== oldName && state.students[currentClassKey] && state.students[currentClassKey][oldName]) {
      state.students[currentClassKey][name] = state.students[currentClassKey][oldName];
      delete state.students[currentClassKey][oldName];
      // 迁移预设名单
      const roster = getRoster(currentClassKey);
      roster.forEach(r => { if (r.name === oldName) r.name = name; });
    }
    s.name = name; s.totalScore = num("sfTotal"); s.schoolRank = num("sfRank"); s.classRank = num("sfCRank"); s.physics = num("sfPhy");
  } else {
    if (list.some(x => x.name === name)) { toast("该班已存在同名学生"); return; }
    list.push({ name, totalScore: num("sfTotal"), schoolRank: num("sfRank"), classRank: num("sfCRank"), physics: num("sfPhy") });
  }
  saveState(); renderAll(); openStudentManager();
  toast("已保存");
}

function deleteStudent(name) {
  if (!confirm(`确定删除 ${name} 吗？其作业/提问/备注数据将一并删除。`)) return;
  const list = getClassStudents(currentClassKey);
  const i = list.findIndex(x => x.name === name);
  if (i >= 0) list.splice(i, 1);
  if (state.students[currentClassKey]) delete state.students[currentClassKey][name];
  const roster = getRoster(currentClassKey);
  const ri = roster.findIndex(r => r.name === name);
  if (ri >= 0) roster.splice(ri, 1);
  selected.delete(name);
  // 删除后自动重排 classRank（保持名次连续 1..N）
  reRankClass();
  saveState(); renderAll(); openStudentManager();
  toast(`已删除 ${name}（班级名次已自动重排）`);
}

/* 删除/增删后自动重排 classRank：按总分降序分配 1..N */
function reRankClass() {
  const list = getClassStudents(currentClassKey);
  // 保留缺考生（无 totalScore）的相对位置
  const ranked = list.filter(s => s.totalScore != null && s.totalScore > 0);
  ranked.sort((a, b) => (b.totalScore || 0) - (a.totalScore || 0));
  ranked.forEach((s, idx) => { s.classRank = idx + 1; });
  // 缺考生 classRank 设为 null（不参与名次）
  list.forEach(s => {
    if (s.totalScore == null || s.totalScore <= 0) s.classRank = null;
  });
}

/* 学生列表（默认按班级总分名次排序） */
function surnameOf(name) {
  if (!name) return "Z";
  // 中文姓氏提取（2-3字姓优先）
  if (/^[\u4e00-\u9fa5]/.test(name)) {
    return name.length >= 2 ? name.slice(0, 1) : name;  // 单字姓极少，先按首字
  }
  return name.toUpperCase();
}
function surnameCompare(a, b) {
  const sa = surnameOf(a.s.name), sb = surnameOf(b.s.name);
  // 用 localeCompare 中文排序
  return sa.localeCompare(sb, "zh-CN");
}

  const subMap = {};
  sorted.forEach(s => { const st = getSub(currentClassKey, a.id, s.name); (subMap[st] = subMap[st] || []).push(s); });

  // 等级分组（特优/优秀/良好/补写）
  const gradeGroups = [
    { key: "A", label: GRADE_META.A.label, cls: "A" },
    { key: "B", label: GRADE_META.B.label, cls: "B" },
    { key: "C", label: GRADE_META.C.label, cls: "C" },
    { key: "D", label: GRADE_META.D.label, cls: "D" },
    { key: "none", label: "未批", cls: "none" },
  ];
  const gradeMap = {};
  sorted.forEach(s => { const g = grades[s.name] || "none"; (gradeMap[g] = gradeMap[g] || []).push(s); });

  // 展开某组学生名单（带序号）
  const renderStuRows = (arr, cls) => arr.map((s, i) => `
    <div class="hw-stu-row">
      <span class="hw-stu-no">${i + 1}</span>
      <span class="hw-stu-name">${escapeHtml(s.name)}</span>
      <span class="rank-tag">${s.classRank != null ? "第" + s.classRank + "名" : "缺考"}</span>
    </div>`).join("");

  // 汇总卡片（可点击展开/收起）
  const chip = (key, label, cnt, cls, active) => `
    <button class="hw-sum-chip ${cls} ${active ? "active" : ""}" onclick="toggleHwGroup('${key}')">
      <b>${label}</b><span>${cnt}</span>
    </button>`;

  let html = `<div class="hw-summary">
    <div class="hw-sum-label">收缴状态</div>
    <div class="hw-sum-chips">${subGroups.map(g => chip("sub-" + g.key, g.label, (subMap[g.key] || []).length, g.cls, hwOpenGroup === "sub-" + g.key)).join("")}</div>
    <div class="hw-sum-label">作业等级</div>
    <div class="hw-sum-chips">${gradeGroups.map(g => chip("grade-" + g.key, g.label, (gradeMap[g.key] || []).length, g.cls, hwOpenGroup === "grade-" + g.key)).join("")}</div>
  </div>`;

  // 展开的学生名单
  if (hwOpenGroup && hwOpenGroup.startsWith("sub-")) {
    const key = hwOpenGroup.slice(4);
    const arr = subMap[key] || [];
    const g = subGroups.find(x => x.key === key);
    html += `<div class="hw-stu-panel"><div class="hw-stu-panel-head">${g.label} · ${arr.length} 人</div>${arr.length ? renderStuRows(arr, g.cls) : `<div class="empty-tip">暂无</div>`}</div>`;
  } else if (hwOpenGroup && hwOpenGroup.startsWith("grade-")) {
    const key = hwOpenGroup.slice(6);
    const arr = gradeMap[key] || [];
    const g = gradeGroups.find(x => x.key === key);
    html += `<div class="hw-stu-panel"><div class="hw-stu-panel-head">${g.label} · ${arr.length} 人</div>${arr.length ? renderStuRows(arr, g.cls) : `<div class="empty-tip">暂无</div>`}</div>`;
  }

  document.getElementById("hwListBox").innerHTML = html;

  renderHwHistory();
}

/* 快速批改：当前作业全班等级（特优/优秀/良好/补写）+ 批注 */
function getGrades(clsKey, aId) {
  if (!state.grades) state.grades = {};
  if (!state.grades[clsKey]) state.grades[clsKey] = {};
  if (!state.grades[clsKey][aId]) state.grades[clsKey][aId] = {};
  return state.grades[clsKey][aId];
}
function getGradeNotes(clsKey, aId) {
  if (!state.gradeNotes) state.gradeNotes = {};
  if (!state.gradeNotes[clsKey]) state.gradeNotes[clsKey] = {};
  if (!state.gradeNotes[clsKey][aId]) state.gradeNotes[clsKey][aId] = {};
  return state.gradeNotes[clsKey][aId];
}
function setGrade(name, grade) {
  const a = currentAssignment(currentClassKey);
  const g = getGrades(currentClassKey, a.id);
  g[name] = (g[name] === grade ? null : grade);
  saveState();
  openQuickGrade();
}
function saveGradeNote(name, text) {
  const a = currentAssignment(currentClassKey);
  const notes = getGradeNotes(currentClassKey, a.id);
  if (!text || !text.trim()) delete notes[name];
  else notes[name] = text;
  saveState();
}
function openQuickGrade() {
  const a = currentAssignment(currentClassKey);
  const students = currentStudents().slice().sort((x, y) => (x.classRank || 999) - (y.classRank || 999));
  const g = getGrades(currentClassKey, a.id);
  const notes = getGradeNotes(currentClassKey, a.id);
  const cnt = { A: 0, B: 0, C: 0, D: 0, none: 0 };
  students.forEach(s => { const v = g[s.name]; cnt[v || "none"]++; });
  const total = students.length;
  const done = cnt.A + cnt.B + cnt.C + cnt.D;
  const gradeKeys = ["A", "B", "C", "D"];
  const rows = students.map(s => {
    const cur = g[s.name];
    const rank = s.classRank != null ? `第${s.classRank}名` : "缺考";
    const sub = getSub(currentClassKey, a.id, s.name);
    const subLabel = HW_INFO[sub] ? HW_INFO[sub].label : "";
    const note = notes[s.name] || "";
    return `<div class="qg-row ${cur ? "done" : ""}">
      <div class="qg-name"><span class="rank-tag">${rank}</span> ${escapeHtml(s.name)}<span class="qg-sub">${subLabel}</span></div>
      <div class="qg-btns">
        ${gradeKeys.map(k => `<button class="qg-btn ${k} ${cur === k ? "active" : ""}" onclick="setGrade('${escapeHtml(s.name)}','${k}')">${GRADE_META[k].label}</button>`).join("")}
      </div>
      <textarea class="qg-note" rows="1" placeholder="批注…" oninput="autoResizeEl(this)" onchange="saveGradeNote('${escapeHtml(s.name)}', this.value)">${escapeHtml(note)}</textarea>
    </div>`;
  }).join("");
  openModal(`
    <div class="modal-head"><h2>快速批改 · ${escapeHtml(a.title)}</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="qg-stat">
        ${gradeKeys.map(k => `<span class="qg-pill ${k}">${GRADE_META[k].label} ${cnt[k]}</span>`).join("")}
        <span class="qg-pill none">未批 ${cnt.none}</span>
        <span style="margin-left:auto;color:var(--text2);font-size:12px">已批 ${done}/${total}</span>
      </div>
      <div class="qg-actions">
        ${gradeKeys.map(k => `<button class="mini-btn" onclick="quickGradeAll('${k}')">一键全${GRADE_META[k].label}</button>`).join("")}
        <button class="mini-btn" onclick="quickGradeReset()">清空全部</button>
      </div>
      <div class="qg-list">${rows}</div>
      <div class="qg-legend">
        ${gradeKeys.map(k => `<span><span class="qg-pill ${k}">${GRADE_META[k].label}</span> ${GRADE_META[k].desc}</span>`).join("")}
      </div>
    </div>`);
  document.querySelectorAll(".qg-note").forEach(autoResizeEl);
}
function quickGradeAll(grade) {
  if (!confirm(`把当前作业全班一键标记为「${GRADE_META[grade].label}」？已有等级会被覆盖。`)) return;
  const a = currentAssignment(currentClassKey);
  const g = getGrades(currentClassKey, a.id);
  currentStudents().forEach(s => { g[s.name] = grade; });
  saveState(); openQuickGrade();
}
function quickGradeReset() {
  if (!confirm("清空当前作业全部批改等级？")) return;
  const a = currentAssignment(currentClassKey);
  if (state.grades && state.grades[currentClassKey]) delete state.grades[currentClassKey][a.id];
  saveState(); openQuickGrade();
}

/* 历史作业汇总：每份作业显示已交/未交等汇总，点击切换查看 */
function renderHwHistory() {
  const students = currentStudents();
  const list = getAssignments(currentClassKey).slice().sort((x, y) => (y.id || 0) - (x.id || 0));
  const cur = currentAssignment(currentClassKey);
  const rows = list.map(x => {
    const c = { submitted: 0, missing: 0, late: 0 };
    students.forEach(s => { const st = getSub(currentClassKey, x.id, s.name); c[st] = (c[st] || 0) + 1; });
    return `<div class="hw-hist-item ${String(x.id) === String(cur.id) ? "active" : ""}" onclick="switchAssignment('${x.id}')">
      <div class="hh-top"><b>${escapeHtml(x.title)}</b>${x.date ? `<span class="hh-date">${escapeHtml(x.date)}</span>` : ""}</div>
      <div class="hh-stats">已交${c.submitted} · 未交${c.missing} · 补交${c.late}</div>
    </div>`;
  }).join("");
  document.getElementById("hwHistory").innerHTML = list.length
    ? `<div style="margin:14px 0 4px;font-weight:700;font-size:13px">历史作业（点击切换查看）</div>${rows}`
    : "";
}

function switchAssignment(id) {
  state.currentAssignment[currentClassKey] = id;
  saveState(); renderOverview(); renderStudentList(); renderHwList();
}

/* 一键全交：把当前作业中所有「未交」的学生标记为「已交」（保留已交/补交等已有标记） */
function markAllSubmitted() {
  const a = currentAssignment(currentClassKey);
  const missing = currentStudents().filter(s => getSub(currentClassKey, a.id, s.name) === "missing");
  if (!missing.length) { toast("当前作业已全部交齐，无需操作"); return; }
  if (!confirm(`确定把 ${missing.length} 名未交学生一键标记为「已交」吗？`)) return;
  missing.forEach(s => setSub(currentClassKey, a.id, s.name, "submitted"));
  saveState(); renderStudentList(); renderOverview(); renderHwList();
  toast(`已将 ${missing.length} 人标记为「已交」`);
}
/* 一键设未交：清空当前作业所有收缴标记（全部回到未交） */
function markAllMissing() {
  const a = currentAssignment(currentClassKey);
  if (!confirm("确定把全班重置为「未交」吗？（会清空本作业所有已交/补交等标记）")) return;
  if (state.submissions[currentClassKey]) delete state.submissions[currentClassKey][a.id];
  saveState(); renderStudentList(); renderOverview(); renderHwList();
  toast("全班已重置为「未交」");
}
function openNewAssignment() {
  // 用全品作业本目录 → 章 → 节 → 课时 三层选择
  const chapOpts = Object.entries(QB_CATALOG).map(([k, v]) => `<option value="${k}">${escapeHtml(v.title)}</option>`).join("");
  openModal(`
    <div class="modal-head"><h2>新建作业 · ${clsShort(currentClassKey)}</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="set-row"><label>选择章节</label><select id="naChap" onchange="naChapChange()"><option value="">— 选择章 —</option>${chapOpts}</select></div>
      <div class="set-row"><label>选择节</label><select id="naSec" onchange="naSecChange()" disabled><option>— 选择节 —</option></select></div>

}
function naChapChange() {
  const ch = QB_CATALOG[document.getElementById("naChap").value];
  const secSel = document.getElementById("naSec");
  if (!ch) { secSel.disabled = true; secSel.innerHTML = "<option>— 选择节 —</option>"; return; }
  secSel.disabled = false;
  secSel.innerHTML = "<option value=''>— 选择节 —</option>" + ch.sections.map(s => `<option value="${s.secNo}">第${s.secNo}节 ${escapeHtml(s.secName)}</option>`).join("");
  document.getElementById("naLesson").disabled = true;
  document.getElementById("naLesson").innerHTML = "<option>— 选择课时 —</option>";

function naSecChange() {
  const ch = QB_CATALOG[document.getElementById("naChap").value];
  const secNo = document.getElementById("naSec").value;
  const lesSel = document.getElementById("naLesson");
  const sec = ch && ch.sections.find(s => s.secNo === secNo);
  if (!sec) { lesSel.disabled = true; lesSel.innerHTML = "<option>— 选择课时 —</option>"; return; }
  lesSel.disabled = false;
  lesSel.innerHTML = "<option value=''>— 选择课时 —</option>" + sec.lessons.map(l => `<option value="${l.lessonNo}">第${l.lessonNo}课时 · ${escapeHtml(l.lessonName)}</option>`).join("");
}
function naLessonChange() {
  const ch = QB_CATALOG[document.getElementById("naChap").value];
  const secNo = document.getElementById("naSec").value;
  const lesNo = document.getElementById("naLesson").value;
  const hwKey = `qb:${Object.keys(QB_CATALOG).find(k => QB_CATALOG[k] === ch)}:${secNo}:${lesNo}`;
  const meta = parseHwKey(hwKey);
  if (meta) {
    document.getElementById("naTitle").value = meta.title;
    document.getElementById("naHwKey").value = hwKey;
    document.getElementById("naHwKeyRow").style.display = "";
  }
}
function saveNewAssignment() {
  let title = document.getElementById("naTitle").value.trim();
  const hwKey = document.getElementById("naHwKey").value;
  if (!title && !hwKey) { toast("请选择章节/课时，或填写作业标题"); return; }
  if (!title) { title = (parseHwKey(hwKey) || {}).title || "未命名作业"; document.getElementById("naTitle").value = title; }
  const date = document.getElementById("naDate").value.trim();
  const due = document.getElementById("naDue").value.trim();
  const a = { id: Date.now(), title, date, due, hwKey: hwKey || null, createdAt: Date.now() };
  getAssignments(currentClassKey).push(a);
  state.currentAssignment[currentClassKey] = String(a.id);
  saveState(); closeModal(); renderOverview(); renderStudentList(); renderHwList(); renderBulletin();
  toast("已创建作业：" + title);
}
function deleteAssignment(id) {
  const a = getAssignments(currentClassKey).find(x => String(x.id) === String(id));
  if (!a) return;
  if (!confirm(`确定删除作业「${a.title}」及其收缴记录吗？`)) return;
  state.assignments[currentClassKey] = state.assignments[currentClassKey].filter(x => String(x.id) !== String(id));
  if (state.submissions[currentClassKey]) delete state.submissions[currentClassKey][String(id)];
  if (String(state.currentAssignment[currentClassKey]) === String(id)) state.currentAssignment[currentClassKey] = null;
  saveState(); renderOverview(); renderStudentList(); renderHwList();
  toast("已删除作业");
}

  if (!teacherWrite) html += `<div class="msg-add"><input id="rMsgInput" placeholder="向老师留言…"><button onclick="addMessage('rep')">发送</button></div>`;

function switchClass(key) {

  renderAll();

function setFilter(v) { filterTier = v; renderStudentList(); }
function setSearch(v) { searchQuery = v; renderStudentList(); }
function setSort(v) { sortKey = v; renderFilterBar(); renderStudentList(); }
function toggleRepresentative() {
  isRepresentative = !isRepresentative; batchMode = false; selected.clear();
  weekendOpen = false;  // 教师/课代表模式切换后，周末板块均默认收起

function togglePanel(id) {
  const body = document.getElementById(id + "Body");
  const toggle = document.getElementById(id + "Toggle");
  if (!body || !toggle) return;
  const collapsed = body.classList.contains("hidden");
  if (collapsed) { body.classList.remove("hidden"); toggle.textContent = "收起"; }
  else { body.classList.add("hidden"); toggle.textContent = "展开"; }

function batchSelectAll() {
  const names = currentStudents().map(s => s.name);
  if (selected.size === names.length) selected.clear(); else names.forEach(n => selected.add(n));
  renderBatchBar(); renderStudentList();
}

/* 学生卡片点击（事件委托） */
document.getElementById("studentList").addEventListener("click", e => {
  if (isRepresentative) return;
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const card = btn.closest("[data-idx]"); if (!card) return;
  const idx = Number(card.dataset.idx);
  const action = btn.dataset.action;
  if (action === "hw") openHwModal(idx);
  else if (action === "class") openQuestionModal(idx, "class");
  else if (action === "office") openQuestionModal(idx, "office");
  else if (action === "note") openNoteModal(idx);
});

/* 作业状态（教师六态 / 课代表三态），针对当前作业 */
function openHwModal(idx) {
  const s = currentStudents()[idx];
  const a = currentAssignment(currentClassKey);
  const cur = getSub(currentClassKey, a.id, s.name);
  openModal(`
    <div class="modal-head"><h2>${escapeHtml(s.name)} · 作业状态</h2><button class="modal-close" onclick="closeModal()">×</button></div>

      <div class="empty-tip" style="margin-bottom:8px">作业：${escapeHtml(a.title)}${a.date ? "（" + a.date + "）" : ""}</div>
      <div class="empty-tip" style="margin-bottom:12px">当前：<b>${HW_INFO[cur].label}</b></div>
      <div class="hw-options">
        ${Object.keys(HW_INFO).map(k => `<button class="hw-opt" style="color:${hwColor(k)};background:${hwBg(k)};border-color:${hwLine(k)}" onclick="applyHw('${escapeHtml(s.name)}','${k}')">${HW_INFO[k].label}<span class="ho-sub">${HW_INFO[k].sub}</span></button>`).join("")}

function hwColor(k) { return { missing: "#d03b3b", submitted: "#1f9d55", late: "#6d5bd0" }[k]; }
function hwBg(k) { return { missing: "#fff0f0", submitted: "#e8f6ee", late: "#f1eefd" }[k]; }
function hwLine(k) { return { missing: "#f3c3c3", submitted: "#b9e2ca", late: "#d2c9f5" }[k]; }
function applyHw(name, val) {

  const list = items.map(({ q, qi }) => `

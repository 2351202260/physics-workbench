      <div class="qi-q">问：${escapeHtml(q.q || "（未填）")}</div>
      ${q.a ? `<div class="qi-a">答：${escapeHtml(q.a)}</div>` : ""}
    </div>`).join("");
  openModal(`
    <div class="modal-head"><h2>${escapeHtml(s.name)} · ${title}</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="q-summary">累计提问 ${c.total} 次（课堂 ${c.classN} · 课下 ${c.officeN}）· 本周 ${c.week} · 今日 ${c.today}</div>
      <div class="q-list">${list || `<div class="empty-tip">暂无记录</div>`}</div>
      <div class="q-add">
        <input type="text" id="qInput" placeholder="${type === "class" ? "提问的问题，如：内能的概念？" : "课下问的问题，如：做功的计算"}">
        <input type="text" id="aInput" placeholder="回答情况，如：正确 / 需再巩固">
        <button class="btn primary" onclick="addQuestion('${escapeHtml(s.name)}','${type}')">记录</button>
      </div>
      <div class="modal-actions">
        <button class="btn danger" onclick="clearStudentQuestions('${escapeHtml(s.name)}','${type}')">清空该生全部${title}</button>
      </div>
    </div>`);
}
function addQuestion(name, type) {
  const st = getStudent(currentClassKey, name);
  const q = document.getElementById("qInput").value.trim();
  const a = document.getElementById("aInput").value.trim();
  if (!q && !a) { toast("请至少填写问题或回答情况"); return; }
  const title = type === "class" ? (state.rosterTitle[currentClassKey] || "") : "";
  st.questions.push({ ts: Date.now(), type, q, a, title });
  saveState(); renderStudentList(); renderQueue(); renderLesson();
  toast(`已记录 ${name} 的${type === "class" ? "课堂提问" : "课下答疑"}`);
  const idx = currentStudents().findIndex(s => s.name === name);
  openQuestionModal(idx, type);
}
function delQuestion(name, qi, type) {
  const st = getStudent(currentClassKey, name);
  st.questions.splice(qi, 1);
  saveState(); renderStudentList(); renderQueue(); renderLesson();
  const idx = currentStudents().findIndex(s => s.name === name);
  openQuestionModal(idx, type || "class");  // 重新打开并保持原视图
  toast("已删除该条记录");
}
function clearStudentQuestions(name, type) {
  if (!confirm(`确定清空 ${name} 的全部${type === "class" ? "课堂提问" : "课下答疑"}记录吗？`)) return;
  const st = getStudent(currentClassKey, name);
  st.questions = st.questions.filter(q => q.type !== type);
  saveState(); closeModal(); renderStudentList(); renderQueue(); renderLesson();
  toast(`已清空 ${name} 的${type === "class" ? "课堂提问" : "课下答疑"}记录`);
}

/* 备注 */
function openNoteModal(idx) {
  const s = currentStudents()[idx];
  const st = getStudent(currentClassKey, s.name);
  openModal(`
    <div class="modal-head"><h2>${escapeHtml(s.name)} · 备注</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="q-add"><textarea id="noteInput" placeholder="课上表现、课下答疑等…">${escapeHtml(st.note)}</textarea>
      <button class="btn primary" onclick="saveNote('${escapeHtml(s.name)}')">保存备注</button></div>
    </div>`);
}
function saveNote(name) {
  getStudent(currentClassKey, name).note = document.getElementById("noteInput").value.trim();
  saveState(); closeModal(); toast(`已保存 ${name} 的备注`);
}

/* 删除今日已记录的课堂提问 */
function delLessonQ(name, qi) {
  const st = getStudent(currentClassKey, name);
  st.questions.splice(qi, 1);
  saveState(); renderLesson(); renderStudentList(); renderQueue();
  toast("已删除本条课堂提问");
}

/* 下一个提问（智能推荐）：按分层补差优先，加入本节课预设名单 */
function nextQuestion() {
  const order = { D: 0, C: 1, B: 2, A: 3 };
  const roster = getRoster(currentClassKey);
  const q = currentStudents()
    .filter(s => s.schoolRank != null && s.schoolRank > 0)
    .map(s => ({ s, tier: getTier(s.schoolRank), count: getStudent(currentClassKey, s.name).questions.length }))
    .sort((a, b) => order[a.tier] - order[b.tier] || a.count - b.count || (a.s.classRank || 999) - (b.s.classRank || 999));
  const pick = q.find(x => !roster.some(r => r.name === x.s.name));
  if (!pick) { toast("所有学生均已加入名单"); return; }
  roster.push({ name: pick.s.name, q: "", a: "" });
  saveState(); renderLesson(); renderQueue();
  toast(`已加入：${pick.s.name}（${shortTier(pick.tier)}）`);
}

/* 加入本节课名单 */
function addToRoster(name) {
  const roster = getRoster(currentClassKey);
  if (roster.some(r => r.name === name)) { toast(`${name} 已在名单中`); return; }
  roster.push({ name, q: "", a: "" });
  saveState(); renderLesson(); renderQueue();
  toast(`已加入：${name}`);
}
function removeRoster(ri) { getRoster(currentClassKey).splice(ri, 1); saveState(); renderLesson(); }

/* 确认记录：把预设名单写入个人卡片（累计提问次数 + 问题内容 + 标题/日期） */
function confirmRoster() {
  const roster = getRoster(currentClassKey);
  if (!roster.length) { toast("暂无待确认的提问人选"); return; }
  const title = (document.getElementById("lessonTitle").value || "").trim();
  state.rosterTitle[currentClassKey] = title;
  let n = 0;
  roster.forEach(r => {
    const st = getStudent(currentClassKey, r.name);
    st.questions.push({ ts: Date.now(), type: "class", q: r.q || "", a: r.a || "", title });
    n++;
  });
  roster.length = 0;
  saveState(); renderLesson(); renderQueue(); renderStudentList();
  toast(`已记录 ${n} 名学生的课堂提问到个人卡片`);
}
function saveLessonTitle(v) { state.rosterTitle[currentClassKey] = v; saveState(); }

/* 手动分层选人 */
function openPicker() {
  const roster = getRoster(currentClassKey);
  const inRoster = new Set(roster.map(r => r.name));
  const groups = { A: [], B: [], C: [], D: [], none: [] };
  currentStudents().forEach(s => {
    const tier = getTier(s.schoolRank);
    const st = getStudent(currentClassKey, s.name);
    groups[tier].push({ name: s.name, count: st.questions.length });
  });
  const gLabels = { A: "A指标（拔高）", B: "B指标（中间）", C: "C指标（基础）", D: "未达线（补差）", none: "缺考/未计分" };
  let html = "";
  ["A", "B", "C", "D", "none"].forEach(t => {
    if (!groups[t].length) return;
    const rows = groups[t].map(g => `<button class="picker-item ${inRoster.has(g.name) ? "added" : ""}" onclick="togglePicker('${escapeHtml(g.name)}')"><span class="pi-name">${escapeHtml(g.name)}</span><span class="pi-count">累计 ${g.count} 次</span></button>`).join("");
    html += `<div class="picker-group"><div class="pg-label ${t}">${gLabels[t]}</div><div class="pg-items">${rows}</div></div>`;
  });
  openModal(`
    <div class="modal-head"><h2>手动分层选人</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="empty-tip" style="margin-bottom:10px">点击学生可加入/移出本节课预设名单，已加入的标蓝。</div>
      ${html}
      <div class="modal-actions"><button class="btn primary" onclick="closeModal()">完成</button></div>
    </div>`);
}
function togglePicker(name) {
  const roster = getRoster(currentClassKey);
  const i = roster.findIndex(r => r.name === name);
  if (i >= 0) roster.splice(i, 1); else roster.push({ name, q: "", a: "" });
  saveState(); renderLesson(); openPicker();
}

/* 公告栏保存（按班级+按周） */
function saveWeekTask(v) {
  const board = getBoard(currentClassKey);
  if (currentWeekIdx < 0) currentWeekIdx = computeCurrentWeekIdx();
  board.weekTasks[currentWeekIdx] = v;
  saveState();
}
function autoResizeEl(ta) {
  ta.style.height = "auto";
  ta.style.height = (ta.scrollHeight + 2) + "px";
}
/* 公告栏课时格子：textarea 输入自适应高度，失焦保存（时间/教学内容/作业手动文本） */
document.getElementById("bulletinClasses").addEventListener("input", e => {
  if (e.target && e.target.tagName === "TEXTAREA") autoResizeEl(e.target);
});
document.getElementById("bulletinClasses").addEventListener("change", e => {
  const el = e.target;
  if (!el || !el.dataset || !el.dataset.f) return;
  const w = Number(el.dataset.w), d = Number(el.dataset.d), p = Number(el.dataset.p);
  setLessonOverride(w, d, p, el.dataset.f, el.value === "" ? null : el.value);
});
document.getElementById("bulletinHoliday").addEventListener("change", e => {
  const inp = e.target.closest("input[data-hid]");
  if (!inp) return;
  const board = getBoard(currentClassKey);
  const h = board.holidays.find(x => String(x.id) === inp.dataset.hid);
  if (h) { h[inp.dataset.f] = inp.value; saveState(); }
});
document.getElementById("rosterList").addEventListener("input", e => {
  const inp = e.target.closest("input[data-ri]");
  if (!inp) return;
  const roster = getRoster(currentClassKey);
  const r = roster[Number(inp.dataset.ri)];
  if (r) { r[inp.dataset.f] = inp.value; saveState(); }
});
function addHoliday() {
  const board = getBoard(currentClassKey);
  board.holidays = board.holidays || [];
  board.holidays.push({ id: Date.now(), name: "", hw: "", date: "", due: "" });
  saveState(); renderBulletin();
}
function delHoliday(id) {
  const board = getBoard(currentClassKey);
  board.holidays = board.holidays.filter(h => String(h.id) !== String(id));
  saveState(); renderBulletin();
}

/* 留言 */
function addMessage(board) {
  const inputId = board === "teacher" ? "tMsgInput" : "rMsgInput";
  const v = document.getElementById(inputId).value.trim();
  if (!v) { toast("请输入留言内容"); return; }
  state.messages[board] = state.messages[board] || [];
  state.messages[board].push({ ts: Date.now(), text: v });
  saveState(); renderMessages(); toast("留言已发送");
}
function delMessage(board, i) {
  state.messages[board].splice(i, 1);
  saveState(); renderMessages(); toast("留言已删除");
}

/* 生成今日反馈（针对当前作业：标题 + 日期 + 名单） */
function generateFeedback() {
  const students = currentStudents().slice().sort((x, y) => (x.classRank || 999) - (y.classRank || 999));
  const a = currentAssignment(currentClassKey);
  const groups = { missing: [], late: [] };
  const gradeGroups = { A: [], B: [], C: [], D: [] };
  const grades = getGrades(currentClassKey, a.id);
  const notes = getGradeNotes(currentClassKey, a.id);
  students.forEach(s => {
    const st = getSub(currentClassKey, a.id, s.name);
    if (groups[st]) groups[st].push(s.name);
    const g = grades[s.name];
    if (g && gradeGroups[g]) gradeGroups[g].push(s.name);
  });
  let text = `${clsShort(currentClassKey)} 作业反馈 · ${a.title}${a.date ? "（" + a.date + "）" : ""}\n`;
  if (a.due) text += `上交时间：${a.due}\n`;

  text += `\n【收缴情况】\n`;
  if (!groups.missing.length && !groups.late.length) text += "本作业已全部收齐！\n";
  else {
    if (groups.missing.length) text += `未交（${groups.missing.length}人）：${groups.missing.join("、")}\n`;
    if (groups.late.length) text += `补交（${groups.late.length}人）：${groups.late.join("、")}\n`;
  }

  const gradeLines = Object.keys(GRADE_META).filter(k => gradeGroups[k].length).map(k => `${GRADE_META[k].label}（${gradeGroups[k].length}人）：${gradeGroups[k].join("、")}`);
  if (gradeLines.length) {
    text += `\n【作业等级】\n${gradeLines.join("\n")}\n`;
  }

  // 作业批注：每个有批注的学生一行（附等级），方便督促
  const noteLines = students.filter(s => notes[s.name]).map(s => {
    const g = grades[s.name];
    return `${s.name}${g ? "（" + GRADE_META[g].label + "）" : ""}：${notes[s.name]}`;
  });
  if (noteLines.length) {
    text += `\n【作业批注】\n${noteLines.join("\n")}\n`;
  }

  text += "\n请课代表跟进催收。";
  openModal(`
    <div class="modal-head"><h2>作业反馈</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="feedback-text" id="feedbackText">${escapeHtml(text)}</div>
      <div class="modal-actions" style="margin-top:12px"><button class="btn primary" onclick="copyFeedback()">复制文本</button><button class="btn ghost" onclick="closeModal()">关闭</button></div>
    </div>`);
}
function copyFeedback() {
  const t = document.getElementById("feedbackText").textContent;
  const done = () => toast("已复制，可发给课代表或投屏");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(() => { fallbackCopy(t); done(); });
  else { fallbackCopy(t); done(); }
}
function fallbackCopy(text) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) {} document.body.removeChild(ta); }

/* ============================================================
   6. 数据管理 / 批量 / 设置 / 导入导出
   ============================================================ */
function openDataManage() {
  const c = qCounts(currentStudents().flatMap(s => getStudent(currentClassKey, s.name).questions));
  openModal(`
    <div class="modal-head"><h2>数据管理 · ${clsShort(currentClassKey)}</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="dm-item"><div class="dm-txt">重置当前作业收缴<small>当前作业全班状态回到「未交」</small></div><button class="btn ghost" onclick="resetTodayHw()">重置</button></div>
      <div class="dm-item"><div class="dm-txt">清空本班今日课堂提问<small>今日已提问 ${c.today} 条，删除后不恢复</small></div><button class="btn ghost" onclick="resetTodayClassQ()">清空</button></div>
      <div class="dm-item"><div class="dm-txt">清空本班今日课下答疑<small>仅删除今天的课下答疑记录</small></div><button class="btn ghost" onclick="resetTodayOfficeQ()">清空</button></div>
      <div class="dm-item"><div class="dm-txt">清空本班预设提问名单<small>尚未确认记录的本节课人选</small></div><button class="btn ghost" onclick="clearRoster()">清空</button></div>
      <div class="dm-item"><div class="dm-txt">清空本班全部作业收缴<small>所有作业、所有学生的收缴状态清空</small></div><button class="btn ghost" onclick="resetAllHw()">清空</button></div>
      <div class="dm-item"><div class="dm-txt">清空本班教学公告栏<small>本周教学进度 + 每日/节假日作业内容</small></div><button class="btn ghost" onclick="clearBoard()">清空</button></div>
      <hr style="border:none;border-top:1px solid var(--border);margin:12px 0">
      <div class="dm-item"><div class="dm-txt">清空本班全部提问记录<small>课堂+课下，累计提问次数归零</small></div><button class="btn danger" onclick="clearClassQuestions()">清空</button></div>
      <div class="dm-item"><div class="dm-txt">清空全部班级数据<small>所有班级的作业/提问/备注/留言/公告，不可恢复</small></div><button class="btn danger" onclick="resetAll()">全部清空</button></div>
    </div>`);
}
function resetTodayHw() {
  const a = currentAssignment(currentClassKey);
  if (state.submissions[currentClassKey]) delete state.submissions[currentClassKey][a.id];
  saveState(); renderStudentList(); renderOverview(); renderHwList(); closeModal(); toast("当前作业已重置为未交");
}
function resetTodayClassQ() {
  const t0 = todayStart();
  currentStudents().forEach(s => { const st = getStudent(currentClassKey, s.name); st.questions = st.questions.filter(q => !(q.type === "class" && (q.ts || 0) >= t0)); });
  saveState(); renderStudentList(); renderQueue(); renderLesson(); closeModal(); toast("今日课堂提问已清空");
}
function resetTodayOfficeQ() {
  const t0 = todayStart();
  currentStudents().forEach(s => { const st = getStudent(currentClassKey, s.name); st.questions = st.questions.filter(q => !(q.type === "office" && (q.ts || 0) >= t0)); });
  saveState(); renderStudentList(); renderQueue(); closeModal(); toast("今日课下答疑已清空");
}
function resetAllHw() {
  state.submissions[currentClassKey] = {};
  saveState(); renderStudentList(); renderOverview(); renderHwList(); closeModal(); toast("本班全部作业收缴记录已清空");
}
function clearClassQuestions() {
  if (!confirm(`确定清空 ${clsShort(currentClassKey)} 全部提问记录吗？`)) return;
  currentStudents().forEach(s => { getStudent(currentClassKey, s.name).questions = []; });
  saveState(); renderStudentList(); renderQueue(); renderLesson(); closeModal(); toast("本班提问记录已清空");
}
function clearRoster() {
  getRoster(currentClassKey).length = 0;
  saveState(); renderLesson(); closeModal(); toast("预设提问名单已清空");
}
function clearBoard() {
  state.boards[currentClassKey] = defaultBoard();
  saveState(); renderBulletin(); closeModal(); toast("本班教学公告栏已清空");
}

/* 批量操作 */
function batchClearQuestions() {
  if (!selected.size) { toast("请先勾选学生"); return; }
  if (!confirm(`确定清空已选 ${selected.size} 名学生的全部提问记录吗？`)) return;
  selected.forEach(n => { getStudent(currentClassKey, n).questions = []; });
  saveState(); selected.clear(); renderBatchBar(); renderStudentList(); renderQueue(); renderLesson(); toast("已批量清空提问记录");
}
function batchResetHw() {
  if (!selected.size) { toast("请先勾选学生"); return; }
  const a = currentAssignment(currentClassKey);
  selected.forEach(n => { setSub(currentClassKey, a.id, n, "missing"); });
  saveState(); renderStudentList(); renderOverview(); renderHwList(); toast("已批量重置作业");
}
function batchClearNote() {
  if (!selected.size) { toast("请先勾选学生"); return; }
  selected.forEach(n => { getStudent(currentClassKey, n).note = ""; });
  saveState(); toast("已批量清空备注");
}

/* 设置 */
function openSettings() {
  const rows = CLASS_META.map(m => {
    const t = state.targets[m.key] || { A: 0, B: 2, C: 8 };
    return `<div class="set-row"><label>${m.short}${m.badge ? "（" + m.badge + "）" : ""} A/B/C 指标目标</label>
      <div class="triple"><input type="number" min="0" data-cls="${m.key}" data-t="A" value="${t.A}"><input type="number" min="0" data-cls="${m.key}" data-t="B" value="${t.B}"><input type="number" min="0" data-cls="${m.key}" data-t="C" value="${t.C}"></div></div>`;
  }).join("");
  openModal(`
    <div class="modal-head"><h2>设置 · 指标目标</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="empty-tip" style="margin-bottom:10px">三列依次为 A / B / C 指标目标人数（显示为「达标/目标」）。</div>
      ${rows}
      <div class="modal-actions"><button class="btn primary" onclick="saveSettings()">保存</button><button class="btn ghost" onclick="closeModal()">取消</button></div>
    </div>`);
}
function saveSettings() {
  document.querySelectorAll("#modalBox input[data-cls]").forEach(inp => {
    const cls = inp.dataset.cls, t = inp.dataset.t;
    if (!state.targets[cls]) state.targets[cls] = { A: 0, B: 0, C: 0 };
    state.targets[cls][t] = Math.max(0, parseInt(inp.value || "0", 10));
  });
  saveState(); closeModal(); renderOverview(); toast("指标目标已保存");
}
function resetAll() {
  if (!confirm("确定清空全部班级的所有数据（作业/提问/备注/留言/公告）吗？此操作不可撤销。")) return;
  state = defaultState(); saveState(); closeModal(); renderAll(); toast("已清空全部数据");
}

/* 导出 / 导入 */
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  const d = new Date(); const p = n => String(n).padStart(2, "0");
  a.href = URL.createObjectURL(blob);
  a.download = `物理教学工作台备份_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
  toast("已导出备份文件");
}
function importData(evt) {
  const file = evt.target.files && evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (!obj || typeof obj !== "object" || !obj.students) throw new Error("格式不符");
      state = deepMerge(defaultState(), obj);
      saveState(); renderAll(); toast("导入成功");
    } catch (e) { toast("导入失败：文件格式不正确"); }
  };
  reader.readAsText(file); evt.target.value = "";
}

/* ============================================================
   7. 弹窗通用 + 初始化
   ============================================================ */
const modalMask = document.getElementById("modalMask");
const modalBox = document.getElementById("modalBox");
function openModal(html) { modalBox.innerHTML = html; modalMask.classList.remove("hidden"); }
function closeModal() { modalMask.classList.add("hidden"); modalBox.innerHTML = ""; }
modalMask.addEventListener("click", e => { if (e.target === modalMask) closeModal(); });

/* 若 localStorage 为空但 IndexedDB 有数据，从 IndexedDB 恢复 */
if (!localStorage.getItem(STORAGE_KEY)) {
  idbGet(STORAGE_KEY).then(dbState => {
    if (dbState) { state = deepMerge(defaultState(), dbState); resetCurrentAssignment(); saveState(); renderAll(); }
  });
}

/* 注册 Service Worker（仅在 http/https 下，实现离线与可安装） */
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

renderAll();
</script>
